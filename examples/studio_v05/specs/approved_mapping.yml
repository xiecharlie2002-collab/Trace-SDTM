      - ex_a_raw__EXSTTIM
      - ex_b_raw__DOSE_DATE
      - ex_b_raw__DOSE_TIME
      target_variables: RFSTDTC
      parameters:
        selection: min
        subject_keys: PATNUM
        sources:
        - dataset: ex_a_raw
          date_variable: EXSTDAT
          time_variable: EXSTTIM
          date_formats: m/d/y
          time_formats: H:M
