schema_version: '0.4'
policy_version: 2.0.0
scenario: advanced
identifiers:
  subject_identifier:
    components:
      - {dataset: dm_subject, variable: STUDY, position: 1}
      - {dataset: dm_subject, variable: PATNUM, position: 2}
    separator: '-'
    missing_component_action: stop
  site_identifier:
    source: {dataset: dm_subject, variable: PATNUM}
    delimiter: '-'
    part_position: 1
    indexing: one_based
    missing_delimiter_action: needs_information
date_time_formats:
  evidence_contract: 字段画像属于观察证据，不覆盖批准的研究格式；政策不提供完整函数链或目标变量集合。
  preserve_partial_dates: true
  partial_date_tokens: [UNK, UN]
  prohibit_date_imputation: true
  time_ingestion:
    accepted_precisions: [minute, second]
    normalized_data_type: hms
    supported_formats: ['H:M', 'H:M:S']
  approved_sources:
    - {source: {dataset: dm_subject, variable: IC_DT}, semantic_type: complete_date, formats: [m/d/y]}
    - {source: {dataset: ex_a_raw, variable: EXSTDAT}, semantic_type: complete_date, formats: [m/d/y]}
    - {source: {dataset: ex_a_raw, variable: EXSTTIM}, semantic_type: time, formats: ['H:M']}
    - {source: {dataset: ex_b_raw, variable: DOSE_DATE}, semantic_type: complete_date, formats: [dd-mmm-yyyy]}
    - {source: {dataset: ex_b_raw, variable: DOSE_TIME}, semantic_type: time, formats: ['H:M']}
    - {source: {dataset: ae_merged, variable: AESTDAT}, semantic_type: partial_date, formats: [dd-mmm-yyyy], unknown_tokens: [UNK, UN]}
    - {source: {dataset: ae_merged, variable: AESTTIM}, semantic_type: optional_time, formats: ['H:M']}
    - {source: {dataset: ae_merged, variable: AEENDDAT}, semantic_type: partial_date, formats: [dd-mmm-yyyy], unknown_tokens: [UNK, UN]}
    - {source: {dataset: ae_merged, variable: AEENDTIM}, semantic_type: optional_time, formats: ['H:M']}
    - {source: {dataset: vs_mixed, variable: VTLD}, semantic_type: complete_date, formats: [dd-mmm-yyyy]}
    - {source: {dataset: vs_mixed, variable: VSTIM}, semantic_type: time, formats: ['H:M']}
reference_datetime_rules:
  subject_key: PATNUM
  study_key: STUDY
  selection: earliest_complete_datetime
  sources:
    - {dataset: ex_a_raw, date_variable: EXSTDAT, time_variable: EXSTTIM}
    - {dataset: ex_b_raw, date_variable: DOSE_DATE, time_variable: DOSE_TIME}
  aggregation:
    group_by: [STUDY, PATNUM]
    comparison_precision: datetime
    missing_or_unparseable_action: stop
upstream_outputs:
  subject_identity:
    producer_tasks: [DM_STUDY_IDENTIFIER, DM_UNIQUE_SUBJECT_IDENTIFIER, DM_SUBJECT_IDENTIFIER, DM_SITE_IDENTIFIER]
    grain: one_record_per_subject
    keys: [STUDYID, USUBJID]
    available_fields: [STUDYID, USUBJID, SUBJID, SITEID]
  reference_start:
    producer_task: DM_REFERENCE_START
    grain: one_record_per_subject
    keys: [STUDYID, USUBJID]
    available_fields: [RFSTDTC]
  integrated_adverse_events:
    producer_task: AE_SOURCE_INTEGRATION
    dataset: ae_merged
    grain: one_record_per_event
    keys: [STUDY, PATNUM, AEID]
    downstream_reference_rule: 模型必须引用已声明的 ae_merged 来源编号；父数据集画像仅作为证据。
  expanded_vital_sign_records:
    producer_tasks: [VS_HEIGHT_RECORD, VS_WEIGHT_RECORD, VS_TEMP_RECORD, VS_SYSBP_RECORD, VS_DIABP_RECORD, VS_PULSE_RECORD]
    grain: one_record_per_subject_visit_test
    keys: [STUDYID, USUBJID, VSDTC, VSTESTCD, .SOURCE_ROW]
sequence_rules:
  AE: {record_variables: [STUDYID, USUBJID, AESTDTC, AETERM, AEDECOD, .SOURCE_ROW], start_at: 1}
  VS: {record_variables: [STUDYID, USUBJID, VSDTC, VSTESTCD, VSPOS, VISITNUM, .SOURCE_ROW], start_at: 1}
baseline_rules:
  domain: VS
  reference_field: RFSTDTC
  eligible_visits: [Screening 1]
  baseline_timepoints: []
  selection: last_valid_pre_reference_record
  incomplete_datetime_action: exclude_and_explain
unit_standardization:
  domain: VS
  conversion_set_id: vs_standard_v1
  standard_results_must_use_registered_transform: standardize_unit
  applies_to_identity_conversions: true
  applies_to_value_changing_conversions: true
  unknown_unit_action: stop
  nonnumeric_result_action: stop
  findings:
    - {source_variable: HEIGHT, unit_source: HEIGHTU, test_code: HEIGHT, test_name: Height, original_unit: null, target_unit: cm}
    - {source_variable: WEIGHT, unit_source: WEIGHTU, test_code: WEIGHT, test_name: Weight, original_unit: null, target_unit: kg}
    - {source_variable: TEMP, unit_source: TEMPU, test_code: TEMP, test_name: Temperature, original_unit: null, target_unit: C}
    - {source_variable: SYS_BP, unit_source: SYS_BPU, test_code: SYSBP, test_name: Systolic Blood Pressure, original_unit: null, target_unit: mmHg}
    - {source_variable: DIA_BP, unit_source: DIA_BPU, test_code: DIABP, test_name: Diastolic Blood Pressure, original_unit: null, target_unit: mmHg}
    - {source_variable: PULSE, unit_source: PULSEU, test_code: PULSE, test_name: Pulse Rate, original_unit: null, target_unit: beats/min}
dataset_output_contract:
  applies_when_output_mode: dataset
  target_variables: []
  dataset_name_parameter: output_dataset
  prohibit_dataset_name_in_target_variables: true
  violation_action: reject_plan
parameter_bindings:
  DM_DOMAIN_CONSTANT: {value: DM}
  DM_AGE_UNIT: {value: YEARS, codelist_id: AGEU}
  AE_DOMAIN_CONSTANT: {value: AE}
  AE_ONGOING_STATUS: {ongoing_value: ONGOING, affirmative_values: ['Y', 'Yes']}
  VS_DOMAIN_CONSTANT: {value: VS}
