    registry_version: 1.0.0
    registry_sha256: 01b6685f725c9b42c57b5a591b4226490b071948f83cb89416a6d15acf1b1a37
source_catalog:
  dm_subject:
    file: dm_subject.csv
    form_name: Demographics
    grain: one_record_per_subject
    keys:
    - STUDY
    - PATNUM
  ex_a_raw:
    file: ex_a_raw.csv
    form_name: Exposure A
    grain: many_records_per_subject
    keys:
    - STUDY
    - PATNUM
  ex_b_raw:
    file: ex_b_raw.csv
    form_name: Exposure B
    grain: many_records_per_subject
    keys:
    - STUDY
    - PATNUM
  ae_main:
    file: ae_main.csv
    form_name: Adverse Events
    grain: one_record_per_event
    keys:
    - STUDY
    - PATNUM
    - AEID
  sae_detail:
    file: sae_detail.csv
    form_name: Serious Adverse Event Details
    grain: one_record_per_event
    keys:
    - STUDY
    - PATNUM
    - AEID
  ae_merged:
    derived: yes
    form_name: Adverse Events + Serious Adverse Event Details
    grain: one_record_per_event
    keys:
    - STUDY
    - PATNUM
    - AEID
  vs_mixed:
    file: vs_mixed.csv
    form_name: Vital Signs
    grain: one_record_per_subject_visit
    keys:
    - STUDY
    - PATNUM
    - INSTANCE
domain_sources:
  DM: dm_subject
  AE: ae_main
  VS: vs_mixed
concepts:
- concept_id: DM_CORE
  target_domain: DM
  form_name: Demographics
  source_refs:
  - dataset: dm_subject
    variable: STUDY
    role: study_identifier
  - dataset: dm_subject
    variable: PATNUM
    role: subject_identifier
  depends_on: []
  expected_cardinality: one_record_to_one_record
  required: yes
  steps:
  - transform_id: assign_no_ct
    source_keys:
    - dm_subject.STUDY
    target_variables:
    - STUDYID
    parameters: {}
  - transform_id: hardcode_no_ct
    source_keys: []
    target_variables:
    - DOMAIN
    parameters:
      value: DM
  - transform_id: derive_usubjid
    source_keys:
    - dm_subject.STUDY
    - dm_subject.PATNUM
    target_variables:
    - USUBJID
    parameters:
      separator: '-'
  - transform_id: assign_no_ct
    source_keys:
    - dm_subject.PATNUM
    target_variables:
    - SUBJID
    parameters: {}
  - transform_id: extract_delimited_part
    source_keys:
    - dm_subject.PATNUM
    target_variables:
    - SITEID
    parameters:
      separator: '-'
      position: 1
  review:
    decision: accept
    reviewer: portfolio_demo_reviewer
    reviewed_at: '2026-09-02T09:44:04Z'
    comment: 专家金标准种子，仅用于离线演示。
- concept_id: DM_REFERENCE_START
