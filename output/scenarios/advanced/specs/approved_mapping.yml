  form_name: Exposure A + Exposure B
  source_refs:
  - dataset: ex_a_raw
    variable: EXSTDAT
    role: date
  - dataset: ex_a_raw
    variable: EXSTTIM
    role: time
  - dataset: ex_b_raw
    variable: DOSE_DATE
    role: date
  - dataset: ex_b_raw
    variable: DOSE_TIME
    role: time
  depends_on: DM_CORE
  expected_cardinality: many_records_to_one_subject
  required: yes
  steps:
  - transform_id: derive_reference_datetime
    source_keys:
    - ex_a_raw.EXSTDAT
    - ex_a_raw.EXSTTIM
    - ex_b_raw.DOSE_DATE
    - ex_b_raw.DOSE_TIME
    target_variables:
    - RFSTDTC
    parameters:
      selection: min
      subject_keys: PATNUM
      sources:
      - dataset: ex_a_raw
        date_variable: EXSTDAT
        time_variable: EXSTTIM
        date_formats: m/d/y
        time_formats: H:M
      - dataset: ex_b_raw
        date_variable: DOSE_DATE
        time_variable: DOSE_TIME
        date_formats: dd-mmm-yyyy
        time_formats: H:M
  review:
    decision: accept
    reviewer: portfolio_demo_reviewer
    reviewed_at: '2026-09-02T09:44:04Z'
    comment: 专家金标准种子，仅用于离线演示。
