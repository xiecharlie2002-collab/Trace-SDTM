project:
  name: TraceSDTM
  version: 0.7.0
  study_id: TRACE001
  standard: SDTMIG
  standard_version: '3.4'
  generated_domains:
    - DM
    - AE
    - VS
paths:
  raw_dir: data/raw
  metadata: specs/sdtm_metadata.yml
  controlled_terminology: specs/resources/controlled_terminology.yml
  unit_conversions: specs/resources/unit_conversions.yml
  transform_registry: config/transform_registry.yml
  transform_registry_schema: config/transform_registry.schema.json
  generated_transform_docs: docs/transform_catalog.md
  analysis_plan: specs/analysis_plan.yml
  analysis_plan_schema: specs/analysis_plan.schema.json
  output_base: output/local
model:
  timeout_seconds: 60
  max_attempts: 3
  max_group_characters: 45000
  max_completion_tokens: 8192
  temperature: 0
  endpoint_suffix: /chat/completions
