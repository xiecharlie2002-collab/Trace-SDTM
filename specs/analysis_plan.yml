schema_version: '0.1'
standards:
  adam: '2.1'
  adamig: '1.3'
  occds: '1.1'
  admiral: '1.5.0'
  r2rtf: '1.3.1'
data_cutoff_date: '2025-03-11'
treatments:
  - {name: Placebo, code: PBO, number: 0}
  - {name: Trace Drug 10 mg, code: TRT10, number: 1}
populations:
  itt: POP_ITT_PLANNED_TREATMENT_PRESENT
  safety: POP_SAF_FIRST_DOSE_PRESENT
teae:
  rule_id: TEAE_TRT_START_TO_END_PLUS_WINDOW
  end_window_days: 30
  missing_start_rule: ADMIRAL_CONSERVATIVE
datasets:
  ADSL:
    label: Subject-Level Analysis Dataset
    class: SUBJECT LEVEL ANALYSIS DATASET
    keys: [STUDYID, USUBJID]
    variables:
      - {name: STUDYID, label: Study Identifier, type: character, rule_id: COPY_DM, sources: [DM.STUDYID]}
      - {name: USUBJID, label: Unique Subject Identifier, type: character, rule_id: COPY_DM, sources: [DM.USUBJID]}
      - {name: SUBJID, label: Subject Identifier for the Study, type: character, rule_id: COPY_DM, sources: [DM.SUBJID]}
      - {name: SITEID, label: Study Site Identifier, type: character, rule_id: COPY_DM, sources: [DM.SITEID]}
      - {name: AGE, label: Age, type: numeric, rule_id: COPY_DM, sources: [DM.AGE]}
      - {name: AGEU, label: Age Units, type: character, rule_id: COPY_DM, sources: [DM.AGEU]}
      - {name: SEX, label: Sex, type: character, rule_id: COPY_DM, sources: [DM.SEX]}
      - {name: RACE, label: Race, type: character, rule_id: COPY_DM, sources: [DM.RACE]}
      - {name: ETHNIC, label: Ethnicity, type: character, rule_id: COPY_DM, sources: [DM.ETHNIC]}
      - {name: COUNTRY, label: Country, type: character, rule_id: COPY_DM, sources: [DM.COUNTRY]}
      - {name: TRT01P, label: Planned Treatment for Period 01, type: character, rule_id: TRT_PLANNED_NAME, sources: [DM.ARM]}
      - {name: TRT01PN, label: Planned Treatment for Period 01 Numeric, type: numeric, rule_id: TRT_PLANNED_NUMBER, sources: [DM.ARM, DM.ARMCD]}
      - {name: TRT01A, label: Actual Treatment for Period 01, type: character, rule_id: TRT_ACTUAL_NAME, sources: [DM.ACTARM]}
      - {name: TRT01AN, label: Actual Treatment for Period 01 Numeric, type: numeric, rule_id: TRT_ACTUAL_NUMBER, sources: [DM.ACTARM, DM.ACTARMCD]}
      - {name: TRTSDT, label: Date of First Exposure to Treatment, type: date, rule_id: PARSE_ISO_DATE, sources: [DM.RFSTDTC]}
      - {name: TRTEDT, label: Date of Last Exposure to Treatment, type: date, rule_id: PARSE_ISO_DATE, sources: [DM.RFENDTC]}
      - {name: TRTDURD, label: Total Treatment Duration in Days, type: numeric, rule_id: TRT_DURATION_INCLUSIVE, sources: [DM.RFSTDTC, DM.RFENDTC]}
      - {name: ITTFL, label: Intent-To-Treat Population Flag, type: character, rule_id: POP_ITT_PLANNED_TREATMENT_PRESENT, sources: [DM.ARM]}
      - {name: SAFFL, label: Safety Population Flag, type: character, rule_id: POP_SAF_FIRST_DOSE_PRESENT, sources: [DM.RFSTDTC]}
  ADAE:
    label: Adverse Event Analysis Dataset
    class: OCCURRENCE DATA STRUCTURE
    keys: [STUDYID, USUBJID, AESEQ]
    variables:
      - {name: STUDYID, label: Study Identifier, type: character, rule_id: COPY_AE, sources: [AE.STUDYID]}
      - {name: DOMAIN, label: Domain Abbreviation, type: character, rule_id: COPY_AE, sources: [AE.DOMAIN]}
      - {name: USUBJID, label: Unique Subject Identifier, type: character, rule_id: COPY_AE, sources: [AE.USUBJID]}
      - {name: AESEQ, label: Sequence Number, type: numeric, rule_id: COPY_AE, sources: [AE.AESEQ]}
      - {name: AETERM, label: Reported Term for the Adverse Event, type: character, rule_id: COPY_AE, sources: [AE.AETERM]}
      - {name: AEDECOD, label: Dictionary-Derived Term, type: character, rule_id: COPY_AE, sources: [AE.AEDECOD]}
      - {name: AEBODSYS, label: Body System or Organ Class, type: character, rule_id: COPY_AE, sources: [AE.AEBODSYS]}
      - {name: AESEV, label: Severity or Intensity, type: character, rule_id: COPY_AE, sources: [AE.AESEV]}
      - {name: AESER, label: Serious Event, type: character, rule_id: COPY_AE, sources: [AE.AESER]}
      - {name: AEREL, label: Causality, type: character, rule_id: COPY_AE, sources: [AE.AEREL]}
      - {name: AEOUT, label: Outcome of Adverse Event, type: character, rule_id: COPY_AE, sources: [AE.AEOUT]}
      - {name: AESHOSP, label: Requires or Prolongs Hospitalization, type: character, rule_id: COPY_AE, sources: [AE.AESHOSP]}
      - {name: AESTDTC, label: Start Date of Adverse Event, type: character, rule_id: COPY_AE, sources: [AE.AESTDTC]}
      - {name: AEENDTC, label: End Date of Adverse Event, type: character, rule_id: COPY_AE, sources: [AE.AEENDTC]}
      - {name: AESTDY, label: Study Day of Start of Adverse Event, type: numeric, rule_id: COPY_AE, sources: [AE.AESTDY]}
      - {name: AEENDY, label: Study Day of End of Adverse Event, type: numeric, rule_id: COPY_AE, sources: [AE.AEENDY]}
      - {name: AEENRF, label: End Relative to Reference Period, type: character, rule_id: COPY_AE, sources: [AE.AEENRF]}
      - {name: ASTDT, label: Analysis Start Date, type: date, rule_id: PARSE_ISO_DATE, sources: [AE.AESTDTC]}
      - {name: AENDT, label: Analysis End Date, type: date, rule_id: PARSE_ISO_DATE, sources: [AE.AEENDTC]}
      - {name: TRTP, label: Planned Treatment, type: character, rule_id: COPY_ADSL, sources: [ADSL.TRT01P]}
      - {name: TRTPN, label: Planned Treatment Numeric, type: numeric, rule_id: COPY_ADSL, sources: [ADSL.TRT01PN]}
      - {name: TRTA, label: Actual Treatment, type: character, rule_id: COPY_ADSL, sources: [ADSL.TRT01A]}
      - {name: TRTAN, label: Actual Treatment Numeric, type: numeric, rule_id: COPY_ADSL, sources: [ADSL.TRT01AN]}
      - {name: TRTSDT, label: Date of First Exposure to Treatment, type: date, rule_id: COPY_ADSL, sources: [ADSL.TRTSDT]}
      - {name: TRTEDT, label: Date of Last Exposure to Treatment, type: date, rule_id: COPY_ADSL, sources: [ADSL.TRTEDT]}
      - {name: SAFFL, label: Safety Population Flag, type: character, rule_id: COPY_ADSL, sources: [ADSL.SAFFL]}
      - {name: TRTEMFL, label: Treatment-Emergent Analysis Flag, type: character, rule_id: TEAE_TRT_START_TO_END_PLUS_WINDOW, sources: [AE.AESTDTC, AE.AEENDTC, ADSL.TRTSDT, ADSL.TRTEDT]}
      - {name: AOCCFL, label: First Treatment-Emergent Event Flag, type: character, rule_id: FIRST_TEAE_SUBJECT, sources: [ADAE.TRTEMFL, ADAE.ASTDT, AE.AESEQ]}
      - {name: AOCCSFL, label: First Treatment-Emergent Event by System Organ Class Flag, type: character, rule_id: FIRST_TEAE_SUBJECT_SOC, sources: [ADAE.TRTEMFL, AE.AEBODSYS, ADAE.ASTDT, AE.AESEQ]}
      - {name: AOCCPFL, label: First Treatment-Emergent Event by Preferred Term Flag, type: character, rule_id: FIRST_TEAE_SUBJECT_SOC_PT, sources: [ADAE.TRTEMFL, AE.AEBODSYS, AE.AEDECOD, ADAE.ASTDT, AE.AESEQ]}
tables:
  T14.1.1:
    title: Demographic Characteristics
    population: ITTFL
    treatment_basis: planned
    shell_rule_id: T_DEMOGRAPHICS_STANDARD
    formats: [csv, html, rtf]
  T14.3.1:
    title: Treatment-Emergent Adverse Events by System Organ Class and Preferred Term
    population: SAFFL
    treatment_basis: actual
    shell_rule_id: T_TEAE_SOC_PT
    formats: [csv, html, rtf]
