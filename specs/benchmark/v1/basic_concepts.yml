schema_version: '0.2'
specification:
  name: TraceSDTM basic benchmark concept specification
  version: 1.0.0
  status: frozen
  standard: SDTMIG 3.4
  scenario: basic
  benchmark_level: basic
  expected_concept_count: 18
  approval: {reviewer: benchmark-author, approved_at: '2026-09-02', review_workbook_sha256: null}
source_catalog:
  dm_basic:
    file: dm_raw.csv
    form_name: Demographics
    grain: one_record_per_subject
    keys: [STUDY, PATNUM]
  ae_basic:
    file: ae_raw.csv
    form_name: Adverse Events
    grain: one_record_per_event
    keys: [STUDY, PATNUM, AEID]
  vs_basic:
    file: vs_raw.csv
    form_name: Vital Signs
    grain: one_record_per_finding
    keys: [STUDY, PATNUM, VSID]
domain_sources: {DM: dm_basic, AE: ae_basic, VS: vs_basic}
concepts:
  - concept_id: DM_STUDY_IDENTIFIER
    target_domain: DM
    form_name: Demographics
    source_refs: [{dataset: dm_basic, variable: STUDY, role: study_identifier}]
    depends_on: []
    expected_cardinality: one_record_to_one_record
    required: true
    difficulty: simple
