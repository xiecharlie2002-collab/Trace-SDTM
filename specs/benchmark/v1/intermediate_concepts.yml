schema_version: '0.2'
specification:
  name: TraceSDTM intermediate benchmark concept specification
  version: 1.0.0
  status: locked_for_blind_evaluation
  standard: SDTMIG 3.4
  scenario: intermediate
  approval: {reviewer: null, approved_at: null, review_workbook_sha256: null}
source_catalog:
  dm_intermediate:
    file: dm_intermediate.csv
    form_name: Demographics
    grain: one_record_per_subject
    keys: [STUDY, PATNUM]
  ae_intermediate:
    file: ae_intermediate.csv
    form_name: Adverse Events
    grain: one_record_per_event
    keys: [STUDY, PATNUM, AEID]
  vs_intermediate:
    file: vs_intermediate.csv
    form_name: Vital Signs
    grain: one_record_per_subject_visit
    keys: [STUDY, PATNUM, INSTANCE]
domain_sources: {DM: dm_intermediate, AE: ae_intermediate, VS: vs_intermediate}
concepts:
  - concept_id: DM_CORE
    target_domain: DM
    form_name: Demographics
    source_refs:
      - {dataset: dm_intermediate, variable: STUDY, role: study_identifier}
      - {dataset: dm_intermediate, variable: PATNUM, role: subject_identifier}
    depends_on: []
    expected_cardinality: one_record_to_one_record
    required: true
    difficulty: moderate
  - concept_id: DM_REFERENCE_START
    target_domain: DM
    form_name: Demographics
    source_refs:
      - {dataset: dm_intermediate, variable: FIRST_DOSE_DATE, role: date}
      - {dataset: dm_intermediate, variable: FIRST_DOSE_TIME, role: time}
    depends_on: [DM_CORE]
    expected_cardinality: one_record_to_one_record
    required: true
    difficulty: moderate
  - concept_id: DM_CONSENT
    target_domain: DM
    form_name: Demographics
    source_refs:
      - {dataset: dm_intermediate, variable: IC_DATE, role: date}
    depends_on: [DM_CORE]
    expected_cardinality: one_record_to_one_record
    required: true
    difficulty: moderate
  - concept_id: DM_DEMOGRAPHICS
    target_domain: DM
    form_name: Demographics
    source_refs:
      - {dataset: dm_intermediate, variable: AGE, role: age}
      - {dataset: dm_intermediate, variable: SEX, role: sex}
      - {dataset: dm_intermediate, variable: ETHNIC, role: ethnicity}
      - {dataset: dm_intermediate, variable: RACE, role: race}
      - {dataset: dm_intermediate, variable: COUNTRY, role: country}
    depends_on: [DM_CORE]
    expected_cardinality: one_record_to_one_record
    required: true
    difficulty: moderate
  - concept_id: DM_TREATMENT
    target_domain: DM
    form_name: Demographics
    source_refs:
      - {dataset: dm_intermediate, variable: PLANNED_ARMCD, role: planned_arm_code}
      - {dataset: dm_intermediate, variable: PLANNED_ARM, role: planned_arm}
      - {dataset: dm_intermediate, variable: ACTUAL_ARMCD, role: actual_arm_code}
      - {dataset: dm_intermediate, variable: ACTUAL_ARM, role: actual_arm}
    depends_on: [DM_CORE]
    expected_cardinality: one_record_to_one_record
    required: true
    difficulty: moderate
  - concept_id: AE_CORE
    target_domain: AE
    form_name: Adverse Events
    source_refs:
      - {dataset: ae_intermediate, variable: STUDY, role: study_identifier}
      - {dataset: ae_intermediate, variable: PATNUM, role: subject_identifier}
    depends_on: [DM_CORE]
    expected_cardinality: one_record_to_one_record
    required: true
    difficulty: moderate
  - concept_id: AE_TERMS
    target_domain: AE
    form_name: Adverse Events
    source_refs:
      - {dataset: ae_intermediate, variable: AETERM, role: reported_term}
      - {dataset: ae_intermediate, variable: AEDECOD, role: coded_term}
      - {dataset: ae_intermediate, variable: AEBODSYS, role: body_system}
    depends_on: [AE_CORE]
    expected_cardinality: one_record_to_one_record
    required: true
    difficulty: moderate
  - concept_id: AE_SAFETY
    target_domain: AE
    form_name: Adverse Events
    source_refs:
      - {dataset: ae_intermediate, variable: AESEV, role: severity}
      - {dataset: ae_intermediate, variable: AESER, role: serious_indicator}
      - {dataset: ae_intermediate, variable: AESHOSP, role: hospitalization_indicator}
    depends_on: [AE_CORE]
    expected_cardinality: one_record_to_one_record
    required: true
    difficulty: moderate
  - concept_id: AE_REL_OUTCOME
    target_domain: AE
    form_name: Adverse Events
    source_refs:
      - {dataset: ae_intermediate, variable: AEREL, role: causality}
      - {dataset: ae_intermediate, variable: AEOUTCOME, role: outcome}
    depends_on: [AE_CORE]
    expected_cardinality: one_record_to_one_record
    required: true
    difficulty: moderate
  - concept_id: AE_START
    target_domain: AE
    form_name: Adverse Events
    source_refs:
      - {dataset: ae_intermediate, variable: AESTDAT, role: date}
      - {dataset: ae_intermediate, variable: AESTTIM, role: time}
    depends_on: [AE_CORE, DM_REFERENCE_START]
    expected_cardinality: one_record_to_one_record
    required: true
    difficulty: moderate
  - concept_id: AE_END
    target_domain: AE
    form_name: Adverse Events
    source_refs:
      - {dataset: ae_intermediate, variable: AEENDDAT, role: date}
      - {dataset: ae_intermediate, variable: AEENDTIM, role: time}
      - {dataset: ae_intermediate, variable: AEONGO, role: ongoing_indicator}
    depends_on: [AE_CORE, DM_REFERENCE_START]
    expected_cardinality: one_record_to_one_record
    required: true
    difficulty: moderate
  - concept_id: AE_SEQUENCE
    target_domain: AE
    form_name: Adverse Events
    source_refs: []
    depends_on: [AE_CORE, AE_TERMS, AE_START]
    expected_cardinality: domain_post_derivation
    required: true
    difficulty: moderate
  - concept_id: VS_CORE
    target_domain: VS
    form_name: Vital Signs
    source_refs:
      - {dataset: vs_intermediate, variable: STUDY, role: study_identifier}
      - {dataset: vs_intermediate, variable: PATNUM, role: subject_identifier}
      - {dataset: vs_intermediate, variable: INSTANCE, role: visit}
      - {dataset: vs_intermediate, variable: VSDAT, role: date}
      - {dataset: vs_intermediate, variable: VSTIM, role: time}
      - {dataset: vs_intermediate, variable: SUBPOS, role: body_position}
    depends_on: [DM_REFERENCE_START]
    expected_cardinality: one_record_to_many_findings
    required: true
    difficulty: moderate
  - concept_id: VS_HEIGHT
    target_domain: VS
    form_name: Vital Signs
    source_refs: [{dataset: vs_intermediate, variable: HEIGHT, role: result}]
    depends_on: [VS_CORE]
    expected_cardinality: one_observed_value_to_one_record
    required: true
    difficulty: moderate
  - concept_id: VS_WEIGHT
    target_domain: VS
    form_name: Vital Signs
    source_refs: [{dataset: vs_intermediate, variable: WEIGHT, role: result}]
    depends_on: [VS_CORE]
    expected_cardinality: one_observed_value_to_one_record
    required: true
    difficulty: moderate
  - concept_id: VS_TEMP
    target_domain: VS
    form_name: Vital Signs
    source_refs: [{dataset: vs_intermediate, variable: TEMP, role: result}]
    depends_on: [VS_CORE]
    expected_cardinality: one_observed_value_to_one_record
    required: true
    difficulty: moderate
  - concept_id: VS_SYSBP
    target_domain: VS
    form_name: Vital Signs
    source_refs: [{dataset: vs_intermediate, variable: SYSBP, role: result}]
    depends_on: [VS_CORE]
    expected_cardinality: one_observed_value_to_one_record
    required: true
    difficulty: moderate
  - concept_id: VS_DIABP
    target_domain: VS
    form_name: Vital Signs
    source_refs: [{dataset: vs_intermediate, variable: DIABP, role: result}]
    depends_on: [VS_CORE]
    expected_cardinality: one_observed_value_to_one_record
    required: true
    difficulty: moderate
  - concept_id: VS_PULSE
    target_domain: VS
    form_name: Vital Signs
    source_refs: [{dataset: vs_intermediate, variable: PULSE, role: result}]
    depends_on: [VS_CORE]
    expected_cardinality: one_observed_value_to_one_record
    required: true
    difficulty: moderate
  - concept_id: VS_POST_DERIVATIONS
    target_domain: VS
    form_name: Vital Signs
    source_refs: []
    depends_on: [VS_HEIGHT, VS_WEIGHT, VS_TEMP, VS_SYSBP, VS_DIABP, VS_PULSE]
    expected_cardinality: domain_post_derivation
    required: true
    difficulty: moderate
