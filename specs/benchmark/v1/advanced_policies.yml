policy_version: 1.0.0
scenario: advanced

identifiers:
  subject_identifier:
    components:
      - {dataset: dm_subject, variable: STUDY, position: 1}
      - {dataset: dm_subject, variable: PATNUM, position: 2}
    separator: '-'
    missing_component_action: stop
  site_identifier:
    source: {dataset: dm_subject, variable: PATNUM}
    delimiter: '-'
    part_position: 1
    indexing: one_based
    missing_delimiter_action: needs_information

date_time_formats:
  evidence_contract: >-
    Field profiles are observational evidence and do not override these approved
    study formats. The policy does not prescribe a complete transform chain or a
    complete target-variable set for any concept.
  preserve_partial_dates: true
  partial_date_tokens: [UNK, UN]
  prohibit_date_imputation: true
  time_ingestion:
    accepted_precisions: [minute, second]
    normalized_data_type: hms
    supported_formats: ['H:M', 'H:M:S']
  approved_sources:
    - source: {dataset: dm_subject, variable: IC_DT}
      semantic_type: complete_date
      formats: [m/d/y]
    - source: {dataset: ex_a_raw, variable: EXSTDAT}
      semantic_type: complete_date
      formats: [m/d/y]
    - source: {dataset: ex_a_raw, variable: EXSTTIM}
      semantic_type: time
      formats: ['H:M']
    - source: {dataset: ex_b_raw, variable: DOSE_DATE}
      semantic_type: complete_date
      formats: [dd-mmm-yyyy]
    - source: {dataset: ex_b_raw, variable: DOSE_TIME}
      semantic_type: time
      formats: ['H:M']
    - source: {dataset: ae_merged, variable: AESTDAT}
      semantic_type: partial_date
      formats: [dd-mmm-yyyy]
      unknown_tokens: [UNK, UN]
    - source: {dataset: ae_merged, variable: AESTTIM}
      semantic_type: optional_time
      formats: ['H:M']
    - source: {dataset: ae_merged, variable: AEENDDAT}
      semantic_type: partial_date
      formats: [dd-mmm-yyyy]
      unknown_tokens: [UNK, UN]
    - source: {dataset: ae_merged, variable: AEENDTIM}
      semantic_type: optional_time
      formats: ['H:M']
    - source: {dataset: vs_mixed, variable: VTLD}
      semantic_type: complete_date
      formats: [dd-mmm-yyyy]
    - source: {dataset: vs_mixed, variable: VSTIM}
      semantic_type: time
      formats: ['H:M']

reference_datetime_rules:
  subject_key: PATNUM
  study_key: STUDY
  selection: earliest_complete_datetime
  sources:
    - dataset: ex_a_raw
      date_variable: EXSTDAT
      time_variable: EXSTTIM
    - dataset: ex_b_raw
      date_variable: DOSE_DATE
      time_variable: DOSE_TIME
  aggregation:
    group_by: [STUDY, PATNUM]
    comparison_precision: datetime
    missing_or_unparseable_action: stop

upstream_outputs:
  subject_identity:
    grain: one_record_per_subject
    keys: [STUDYID, USUBJID]
    available_fields: [STUDYID, USUBJID, SUBJID, SITEID]
  reference_start:
    grain: one_record_per_subject
    keys: [STUDYID, USUBJID]
    available_fields: [RFSTDTC]
    downstream_use: [study_day_reference, baseline_reference]
  integrated_adverse_events:
    dataset: ae_merged
    grain: one_record_per_event
    keys: [STUDY, PATNUM, AEID]
    available_field_groups:
      - source_identifiers
      - event_terms
      - safety_indicators
      - relationship_and_outcome
      - start_and_end_datetime_parts
    downstream_reference_rule: >-
      Models must cite declared ae_merged source references; parent-dataset
      profiles are evidence only.
  expanded_vital_sign_records:
    grain: one_record_per_subject_visit_test
    keys: [STUDYID, USUBJID, VSDTC, VSTESTCD, .SOURCE_ROW]
    available_fields_for_post_derivation:
      [STUDYID, USUBJID, VSDTC, VSTESTCD, VSPOS, VISITNUM, .SOURCE_ROW]

sequence_rules:
  AE:
    record_variables:
      [STUDYID, USUBJID, AESTDTC, AETERM, AEDECOD, .SOURCE_ROW]
    source_row_field: .SOURCE_ROW
  VS:
    record_variables:
      [STUDYID, USUBJID, VSDTC, VSTESTCD, VSPOS, VISITNUM, .SOURCE_ROW]
    source_row_field: .SOURCE_ROW

baseline_rules:
  domain: VS
  reference_field: RFSTDTC
  eligible_visits: [Screening 1]
  baseline_timepoints: []
  selection: last_valid_pre_reference_record
  incomplete_datetime_action: exclude_and_explain

unit_standardization:
  domain: VS
  conversion_set_id: vs_standard_v1
  standard_results_must_use_registered_transform: standardize_unit
  applies_to_identity_conversions: true
  applies_to_value_changing_conversions: true
  model_may_select: [conversion_set_id, target_unit]
  model_must_not_supply: [multiplier, offset, rounding_formula, free_formula]
  unknown_unit_action: stop
  nonnumeric_result_action: stop
  rationale: >-
    Identity conversions still perform numeric parsing, unit normalization,
    controlled rounding and versioned traceability.

dataset_output_contract:
  applies_when_output_mode: dataset
  target_variables: []
  dataset_name_parameter: output_dataset
  prohibit_dataset_name_in_target_variables: true
  violation_action: reject_plan
