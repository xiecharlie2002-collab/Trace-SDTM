schema_version: '0.4'
specification:
  name: TraceSDTM v0.4 intermediate atomic tasks
  version: 2.0.0
  status: frozen
  standard: SDTMIG 3.4
  scenario: intermediate
  benchmark_level: intermediate
  expected_task_count: 49
source_catalog:
  dm_intermediate: {file: dm_intermediate.csv, form_name: Demographics, grain: one_record_per_subject, keys: [STUDY, PATNUM]}
  ae_intermediate: {file: ae_intermediate.csv, form_name: Adverse Events, grain: one_record_per_event, keys: [STUDY, PATNUM, AEID]}
  vs_intermediate: {file: vs_intermediate.csv, form_name: Vital Signs, grain: one_record_per_subject_visit, keys: [STUDY, PATNUM, INSTANCE]}
domain_sources: {DM: dm_intermediate, AE: ae_intermediate, VS: vs_intermediate}
tasks:
  # DM_CORE (five atomic clinical actions)
  - {task_id: DM_STUDY_IDENTIFIER, assembly_group_id: DM_CORE, target_domain: DM, form_name: Demographics, source_refs: [{ref_id: dm_intermediate__STUDY, dataset: dm_intermediate, variable: STUDY, role: study_identifier}], depends_on: [], required: true, intent: Map the study identifier.}
  - {task_id: DM_DOMAIN_CONSTANT, assembly_group_id: DM_CORE, target_domain: DM, form_name: Demographics, source_refs: [], depends_on: [], required: true, intent: Set the DM domain constant.}
  - task_id: DM_UNIQUE_SUBJECT_IDENTIFIER
    assembly_group_id: DM_CORE
    target_domain: DM
    form_name: Demographics
    source_refs:
      - {ref_id: dm_intermediate__STUDY, dataset: dm_intermediate, variable: STUDY, role: study_identifier}
      - {ref_id: dm_intermediate__PATNUM, dataset: dm_intermediate, variable: PATNUM, role: subject_identifier}
    depends_on: []
    required: true
    intent: Derive the unique subject identifier.
  - {task_id: DM_SUBJECT_IDENTIFIER, assembly_group_id: DM_CORE, target_domain: DM, form_name: Demographics, source_refs: [{ref_id: dm_intermediate__PATNUM, dataset: dm_intermediate, variable: PATNUM, role: subject_identifier}], depends_on: [], required: true, intent: Map the sponsor subject identifier.}
  - {task_id: DM_SITE_IDENTIFIER, assembly_group_id: DM_CORE, target_domain: DM, form_name: Demographics, source_refs: [{ref_id: dm_intermediate__PATNUM, dataset: dm_intermediate, variable: PATNUM, role: site_and_subject_identifier}], depends_on: [], required: true, intent: Extract the site identifier from the sponsor subject identifier.}
  - task_id: DM_REFERENCE_START
    assembly_group_id: DM_REFERENCE_START
    target_domain: DM
    form_name: Demographics
    source_refs:
      - {ref_id: dm_intermediate__FIRST_DOSE_DATE, dataset: dm_intermediate, variable: FIRST_DOSE_DATE, role: date}
      - {ref_id: dm_intermediate__FIRST_DOSE_TIME, dataset: dm_intermediate, variable: FIRST_DOSE_TIME, role: time}
    depends_on: [DM_UNIQUE_SUBJECT_IDENTIFIER]
    required: true
    intent: Combine first-dose date and time as the subject reference start datetime.
  - {task_id: DM_CONSENT, assembly_group_id: DM_CONSENT, target_domain: DM, form_name: Demographics, source_refs: [{ref_id: dm_intermediate__IC_DATE, dataset: dm_intermediate, variable: IC_DATE, role: date}], depends_on: [DM_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Convert informed consent date to ISO 8601.}
  # DM_DEMOGRAPHICS (six atomic actions)
  - {task_id: DM_AGE, assembly_group_id: DM_DEMOGRAPHICS, target_domain: DM, form_name: Demographics, source_refs: [{ref_id: dm_intermediate__AGE, dataset: dm_intermediate, variable: AGE, role: age}], depends_on: [DM_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map age.}
  - {task_id: DM_AGE_UNIT, assembly_group_id: DM_DEMOGRAPHICS, target_domain: DM, form_name: Demographics, source_refs: [], depends_on: [DM_AGE], required: true, intent: Set the controlled age unit.}
  - {task_id: DM_SEX, assembly_group_id: DM_DEMOGRAPHICS, target_domain: DM, form_name: Demographics, source_refs: [{ref_id: dm_intermediate__SEX, dataset: dm_intermediate, variable: SEX, role: sex}], depends_on: [DM_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map sex using controlled terminology.}
  - {task_id: DM_ETHNICITY, assembly_group_id: DM_DEMOGRAPHICS, target_domain: DM, form_name: Demographics, source_refs: [{ref_id: dm_intermediate__ETHNIC, dataset: dm_intermediate, variable: ETHNIC, role: ethnicity}], depends_on: [DM_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map ethnicity using controlled terminology.}
  - {task_id: DM_RACE, assembly_group_id: DM_DEMOGRAPHICS, target_domain: DM, form_name: Demographics, source_refs: [{ref_id: dm_intermediate__RACE, dataset: dm_intermediate, variable: RACE, role: race}], depends_on: [DM_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map race using controlled terminology.}
  - {task_id: DM_COUNTRY, assembly_group_id: DM_DEMOGRAPHICS, target_domain: DM, form_name: Demographics, source_refs: [{ref_id: dm_intermediate__COUNTRY, dataset: dm_intermediate, variable: COUNTRY, role: country}], depends_on: [DM_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map country.}
  # DM_TREATMENT (four atomic actions)
  - {task_id: DM_PLANNED_ARM_CODE, assembly_group_id: DM_TREATMENT, target_domain: DM, form_name: Demographics, source_refs: [{ref_id: dm_intermediate__PLANNED_ARMCD, dataset: dm_intermediate, variable: PLANNED_ARMCD, role: planned_arm_code}], depends_on: [DM_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map the planned arm code.}
  - {task_id: DM_PLANNED_ARM, assembly_group_id: DM_TREATMENT, target_domain: DM, form_name: Demographics, source_refs: [{ref_id: dm_intermediate__PLANNED_ARM, dataset: dm_intermediate, variable: PLANNED_ARM, role: planned_arm}], depends_on: [DM_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map the planned arm description.}
  - {task_id: DM_ACTUAL_ARM_CODE, assembly_group_id: DM_TREATMENT, target_domain: DM, form_name: Demographics, source_refs: [{ref_id: dm_intermediate__ACTUAL_ARMCD, dataset: dm_intermediate, variable: ACTUAL_ARMCD, role: actual_arm_code}], depends_on: [DM_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map the actual arm code.}
  - {task_id: DM_ACTUAL_ARM, assembly_group_id: DM_TREATMENT, target_domain: DM, form_name: Demographics, source_refs: [{ref_id: dm_intermediate__ACTUAL_ARM, dataset: dm_intermediate, variable: ACTUAL_ARM, role: actual_arm}], depends_on: [DM_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map the actual arm description.}
  # AE atomic actions
  - {task_id: AE_STUDY_IDENTIFIER, assembly_group_id: AE_CORE, target_domain: AE, form_name: Adverse Events, source_refs: [{ref_id: ae_intermediate__STUDY, dataset: ae_intermediate, variable: STUDY, role: study_identifier}], depends_on: [DM_STUDY_IDENTIFIER], required: true, intent: Map the study identifier to AE.}
  - {task_id: AE_DOMAIN_CONSTANT, assembly_group_id: AE_CORE, target_domain: AE, form_name: Adverse Events, source_refs: [], depends_on: [], required: true, intent: Set the AE domain constant.}
  - task_id: AE_UNIQUE_SUBJECT_IDENTIFIER
    assembly_group_id: AE_CORE
    target_domain: AE
    form_name: Adverse Events
    source_refs:
      - {ref_id: ae_intermediate__STUDY, dataset: ae_intermediate, variable: STUDY, role: study_identifier}
      - {ref_id: ae_intermediate__PATNUM, dataset: ae_intermediate, variable: PATNUM, role: subject_identifier}
    depends_on: [DM_UNIQUE_SUBJECT_IDENTIFIER]
    required: true
    intent: Derive the unique subject identifier for AE.
  - {task_id: AE_REPORTED_TERM, assembly_group_id: AE_TERMS, target_domain: AE, form_name: Adverse Events, source_refs: [{ref_id: ae_intermediate__AETERM, dataset: ae_intermediate, variable: AETERM, role: reported_term}], depends_on: [AE_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map the reported adverse event term.}
  - {task_id: AE_CODED_TERM, assembly_group_id: AE_TERMS, target_domain: AE, form_name: Adverse Events, source_refs: [{ref_id: ae_intermediate__AEDECOD, dataset: ae_intermediate, variable: AEDECOD, role: coded_term}], depends_on: [AE_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map the coded adverse event term.}
  - {task_id: AE_BODY_SYSTEM, assembly_group_id: AE_TERMS, target_domain: AE, form_name: Adverse Events, source_refs: [{ref_id: ae_intermediate__AEBODSYS, dataset: ae_intermediate, variable: AEBODSYS, role: body_system}], depends_on: [AE_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Normalize and map the body system term.}
  - {task_id: AE_SEVERITY, assembly_group_id: AE_SAFETY, target_domain: AE, form_name: Adverse Events, source_refs: [{ref_id: ae_intermediate__AESEV, dataset: ae_intermediate, variable: AESEV, role: severity}], depends_on: [AE_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map adverse event severity.}
  - {task_id: AE_SERIOUS, assembly_group_id: AE_SAFETY, target_domain: AE, form_name: Adverse Events, source_refs: [{ref_id: ae_intermediate__AESER, dataset: ae_intermediate, variable: AESER, role: serious_indicator}], depends_on: [AE_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map the serious-event indicator.}
  - {task_id: AE_HOSPITALIZATION, assembly_group_id: AE_SAFETY, target_domain: AE, form_name: Adverse Events, source_refs: [{ref_id: ae_intermediate__AESHOSP, dataset: ae_intermediate, variable: AESHOSP, role: hospitalization_indicator}], depends_on: [AE_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map the hospitalization indicator.}
  - {task_id: AE_RELATIONSHIP, assembly_group_id: AE_REL_OUTCOME, target_domain: AE, form_name: Adverse Events, source_refs: [{ref_id: ae_intermediate__AEREL, dataset: ae_intermediate, variable: AEREL, role: causality}], depends_on: [AE_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map relationship to study treatment.}
  - {task_id: AE_OUTCOME, assembly_group_id: AE_REL_OUTCOME, target_domain: AE, form_name: Adverse Events, source_refs: [{ref_id: ae_intermediate__AEOUTCOME, dataset: ae_intermediate, variable: AEOUTCOME, role: outcome}], depends_on: [AE_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map adverse event outcome.}
  - task_id: AE_START_DATETIME
    assembly_group_id: AE_START
    target_domain: AE
    form_name: Adverse Events
    source_refs:
      - {ref_id: ae_intermediate__AESTDAT, dataset: ae_intermediate, variable: AESTDAT, role: date}
      - {ref_id: ae_intermediate__AESTTIM, dataset: ae_intermediate, variable: AESTTIM, role: time}
    depends_on: [AE_UNIQUE_SUBJECT_IDENTIFIER]
    required: true
    intent: Combine adverse event start date and time as ISO 8601 datetime.
  - {task_id: AE_START_STUDY_DAY, assembly_group_id: AE_START, target_domain: AE, form_name: Adverse Events, source_refs: [], depends_on: [AE_START_DATETIME, DM_REFERENCE_START], required: true, intent: Derive adverse event start study day.}
  - task_id: AE_END_DATETIME
    assembly_group_id: AE_END
    target_domain: AE
    form_name: Adverse Events
    source_refs:
      - {ref_id: ae_intermediate__AEENDDAT, dataset: ae_intermediate, variable: AEENDDAT, role: date}
      - {ref_id: ae_intermediate__AEENDTIM, dataset: ae_intermediate, variable: AEENDTIM, role: time}
    depends_on: [AE_UNIQUE_SUBJECT_IDENTIFIER]
    required: true
    intent: Combine adverse event end date and time as ISO 8601 datetime.
  - task_id: AE_ONGOING_STATUS
    assembly_group_id: AE_END
    target_domain: AE
    form_name: Adverse Events
    source_refs:
      - {ref_id: ae_intermediate__AEENDDAT, dataset: ae_intermediate, variable: AEENDDAT, role: end_date}
      - {ref_id: ae_intermediate__AEONGO, dataset: ae_intermediate, variable: AEONGO, role: ongoing_indicator}
    depends_on: [AE_UNIQUE_SUBJECT_IDENTIFIER]
    required: true
    intent: Derive the SDTM ongoing-event reference value.
  - {task_id: AE_END_STUDY_DAY, assembly_group_id: AE_END, target_domain: AE, form_name: Adverse Events, source_refs: [], depends_on: [AE_END_DATETIME, DM_REFERENCE_START], required: true, intent: Derive adverse event end study day.}
  - {task_id: AE_SEQUENCE, assembly_group_id: AE_SEQUENCE, target_domain: AE, form_name: Adverse Events, source_refs: [], depends_on: [AE_UNIQUE_SUBJECT_IDENTIFIER, AE_REPORTED_TERM, AE_CODED_TERM, AE_START_DATETIME], required: true, intent: Derive a stable within-subject AE sequence.}
  # VS core and visit actions
  - {task_id: VS_STUDY_IDENTIFIER, assembly_group_id: VS_CORE, target_domain: VS, form_name: Vital Signs, source_refs: [{ref_id: vs_intermediate__STUDY, dataset: vs_intermediate, variable: STUDY, role: study_identifier}], depends_on: [DM_STUDY_IDENTIFIER], required: true, intent: Map the study identifier to VS.}
  - {task_id: VS_DOMAIN_CONSTANT, assembly_group_id: VS_CORE, target_domain: VS, form_name: Vital Signs, source_refs: [], depends_on: [], required: true, intent: Set the VS domain constant.}
  - task_id: VS_UNIQUE_SUBJECT_IDENTIFIER
    assembly_group_id: VS_CORE
    target_domain: VS
    form_name: Vital Signs
    source_refs:
      - {ref_id: vs_intermediate__STUDY, dataset: vs_intermediate, variable: STUDY, role: study_identifier}
      - {ref_id: vs_intermediate__PATNUM, dataset: vs_intermediate, variable: PATNUM, role: subject_identifier}
    depends_on: [DM_UNIQUE_SUBJECT_IDENTIFIER]
    required: true
    intent: Derive the unique subject identifier for VS.
  - {task_id: VS_VISIT, assembly_group_id: VS_CORE, target_domain: VS, form_name: Vital Signs, source_refs: [{ref_id: vs_intermediate__INSTANCE, dataset: vs_intermediate, variable: INSTANCE, role: visit}], depends_on: [VS_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map the visit name.}
  - {task_id: VS_VISIT_NUMBER, assembly_group_id: VS_CORE, target_domain: VS, form_name: Vital Signs, source_refs: [{ref_id: vs_intermediate__INSTANCE, dataset: vs_intermediate, variable: INSTANCE, role: visit}], depends_on: [VS_VISIT], required: true, intent: Derive the numeric visit value from the approved visit table.}
  - task_id: VS_DATETIME
    assembly_group_id: VS_CORE
    target_domain: VS
    form_name: Vital Signs
    source_refs:
      - {ref_id: vs_intermediate__VSDAT, dataset: vs_intermediate, variable: VSDAT, role: date}
      - {ref_id: vs_intermediate__VSTIM, dataset: vs_intermediate, variable: VSTIM, role: time}
    depends_on: [VS_UNIQUE_SUBJECT_IDENTIFIER]
    required: true
    intent: Combine vital signs date and time as ISO 8601 datetime.
  - {task_id: VS_POSITION, assembly_group_id: VS_CORE, target_domain: VS, form_name: Vital Signs, source_refs: [{ref_id: vs_intermediate__SUBPOS, dataset: vs_intermediate, variable: SUBPOS, role: body_position}], depends_on: [VS_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map body position using controlled terminology.}
  # One clinical record-expansion action per finding
  - {task_id: VS_HEIGHT_RECORD, assembly_group_id: VS_HEIGHT, target_domain: VS, form_name: Vital Signs, source_refs: [{ref_id: vs_intermediate__HEIGHT, dataset: vs_intermediate, variable: HEIGHT, role: result}], depends_on: [VS_DATETIME], required: true, intent: Expand height into one VS finding record with its original result and unit.}
  - {task_id: VS_WEIGHT_RECORD, assembly_group_id: VS_WEIGHT, target_domain: VS, form_name: Vital Signs, source_refs: [{ref_id: vs_intermediate__WEIGHT, dataset: vs_intermediate, variable: WEIGHT, role: result}], depends_on: [VS_DATETIME], required: true, intent: Expand weight into one VS finding record with its original result and unit.}
  - {task_id: VS_TEMP_RECORD, assembly_group_id: VS_TEMP, target_domain: VS, form_name: Vital Signs, source_refs: [{ref_id: vs_intermediate__TEMP, dataset: vs_intermediate, variable: TEMP, role: result}], depends_on: [VS_DATETIME], required: true, intent: Expand temperature into one VS finding record with its original result and unit.}
  - {task_id: VS_SYSBP_RECORD, assembly_group_id: VS_SYSBP, target_domain: VS, form_name: Vital Signs, source_refs: [{ref_id: vs_intermediate__SYSBP, dataset: vs_intermediate, variable: SYSBP, role: result}], depends_on: [VS_DATETIME], required: true, intent: Expand systolic blood pressure into one VS finding record with its original result and unit.}
  - {task_id: VS_DIABP_RECORD, assembly_group_id: VS_DIABP, target_domain: VS, form_name: Vital Signs, source_refs: [{ref_id: vs_intermediate__DIABP, dataset: vs_intermediate, variable: DIABP, role: result}], depends_on: [VS_DATETIME], required: true, intent: Expand diastolic blood pressure into one VS finding record with its original result and unit.}
  - {task_id: VS_PULSE_RECORD, assembly_group_id: VS_PULSE, target_domain: VS, form_name: Vital Signs, source_refs: [{ref_id: vs_intermediate__PULSE, dataset: vs_intermediate, variable: PULSE, role: result}], depends_on: [VS_DATETIME], required: true, intent: Expand pulse rate into one VS finding record with its original result and unit.}
  - {task_id: VS_SEQUENCE, assembly_group_id: VS_POST_DERIVATIONS, target_domain: VS, form_name: Vital Signs, source_refs: [], depends_on: [VS_HEIGHT_RECORD, VS_WEIGHT_RECORD, VS_TEMP_RECORD, VS_SYSBP_RECORD, VS_DIABP_RECORD, VS_PULSE_RECORD], required: true, intent: Derive a stable within-subject VS sequence.}
  - {task_id: VS_STUDY_DAY, assembly_group_id: VS_POST_DERIVATIONS, target_domain: VS, form_name: Vital Signs, source_refs: [], depends_on: [VS_DATETIME, DM_REFERENCE_START], required: true, intent: Derive the vital signs study day.}
