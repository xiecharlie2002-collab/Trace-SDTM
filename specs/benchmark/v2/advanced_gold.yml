schema_version: '0.4'
benchmark: {name: TraceSDTM v0.4 advanced atomic gold, version: 2.0.0, status: frozen, task_count: 57}
plans:
  DM_STUDY_IDENTIFIER: [{transform_id: assign_no_ct, source_ref_ids: [dm_subject__STUDY], target_variables: [STUDYID], parameters: {}}]
  DM_DOMAIN_CONSTANT: [{transform_id: hardcode_no_ct, source_ref_ids: [], target_variables: [DOMAIN], parameters: {value: DM}}]
  DM_UNIQUE_SUBJECT_IDENTIFIER: [{transform_id: derive_usubjid, source_ref_ids: [dm_subject__STUDY, dm_subject__PATNUM], target_variables: [USUBJID], parameters: {separator: '-'}}]
  DM_SUBJECT_IDENTIFIER: [{transform_id: assign_no_ct, source_ref_ids: [dm_subject__PATNUM], target_variables: [SUBJID], parameters: {}}]
  DM_SITE_IDENTIFIER: [{transform_id: extract_delimited_part, source_ref_ids: [dm_subject__PATNUM], target_variables: [SITEID], parameters: {separator: '-', position: 1}}]
  DM_REFERENCE_START:
    - transform_id: derive_reference_datetime
      source_ref_ids: [ex_a_raw__EXSTDAT, ex_a_raw__EXSTTIM, ex_b_raw__DOSE_DATE, ex_b_raw__DOSE_TIME]
      target_variables: [RFSTDTC]
      parameters:
        selection: min
        subject_keys: [PATNUM]
        sources:
          - {dataset: ex_a_raw, date_variable: EXSTDAT, time_variable: EXSTTIM, date_formats: [m/d/y], time_formats: ['H:M']}
          - {dataset: ex_b_raw, date_variable: DOSE_DATE, time_variable: DOSE_TIME, date_formats: [dd-mmm-yyyy], time_formats: ['H:M']}
  DM_CONSENT: [{transform_id: to_iso8601_date, source_ref_ids: [dm_subject__IC_DT], target_variables: [RFICDTC], parameters: {formats: [m/d/y]}}]
  DM_AGE: [{transform_id: assign_no_ct, source_ref_ids: [dm_subject__AGE], target_variables: [AGE], parameters: {}}]
  DM_AGE_UNIT: [{transform_id: hardcode_ct, source_ref_ids: [], target_variables: [AGEU], parameters: {value: YEARS, codelist_id: AGEU}}]
  DM_SEX: [{transform_id: assign_ct, source_ref_ids: [dm_subject__SEX], target_variables: [SEX], parameters: {codelist_id: SEX}}]
  DM_ETHNICITY: [{transform_id: assign_ct, source_ref_ids: [dm_subject__ETHNIC], target_variables: [ETHNIC], parameters: {codelist_id: ETHNIC}}]
  DM_RACE: [{transform_id: assign_ct, source_ref_ids: [dm_subject__RACE], target_variables: [RACE], parameters: {codelist_id: RACE}}]
  DM_COUNTRY: [{transform_id: assign_no_ct, source_ref_ids: [dm_subject__COUNTRY], target_variables: [COUNTRY], parameters: {}}]
  DM_PLANNED_ARM_CODE: [{transform_id: assign_no_ct, source_ref_ids: [dm_subject__PLANNED_ARMCD], target_variables: [ARMCD], parameters: {}}]
  DM_PLANNED_ARM: [{transform_id: assign_no_ct, source_ref_ids: [dm_subject__PLANNED_ARM], target_variables: [ARM], parameters: {}}]
  DM_ACTUAL_ARM_CODE: [{transform_id: assign_no_ct, source_ref_ids: [dm_subject__ACTUAL_ARMCD], target_variables: [ACTARMCD], parameters: {}}]
  DM_ACTUAL_ARM: [{transform_id: assign_no_ct, source_ref_ids: [dm_subject__ACTUAL_ARM], target_variables: [ACTARM], parameters: {}}]
  AE_SOURCE_INTEGRATION:
    - transform_id: merge_sources
      source_ref_ids: [ae_main__STUDY, ae_main__PATNUM, ae_main__AEID, sae_detail__STUDY, sae_detail__PATNUM, sae_detail__AEID, sae_detail__AESHOSP]
      target_variables: []
      parameters: {left_dataset: ae_main, right_dataset: sae_detail, output_dataset: ae_merged, by: {STUDY: STUDY, PATNUM: PATNUM, AEID: AEID}, relationship: one-to-one, join_type: left, select: [AESHOSP], conflict_policy: error}
  AE_STUDY_IDENTIFIER: [{transform_id: assign_no_ct, source_ref_ids: [ae_merged__STUDY], target_variables: [STUDYID], parameters: {}}]
  AE_DOMAIN_CONSTANT: [{transform_id: hardcode_no_ct, source_ref_ids: [], target_variables: [DOMAIN], parameters: {value: AE}}]
  AE_UNIQUE_SUBJECT_IDENTIFIER: [{transform_id: derive_usubjid, source_ref_ids: [ae_merged__STUDY, ae_merged__PATNUM], target_variables: [USUBJID], parameters: {separator: '-'}}]
  AE_REPORTED_TERM: [{transform_id: assign_no_ct, source_ref_ids: [ae_merged__AETERM], target_variables: [AETERM], parameters: {}}]
  AE_CODED_TERM: [{transform_id: assign_no_ct, source_ref_ids: [ae_merged__AEDECOD], target_variables: [AEDECOD], parameters: {}}]
  AE_BODY_SYSTEM: [{transform_id: normalize_case, source_ref_ids: [ae_merged__AEBODSYS], target_variables: [AEBODSYS], parameters: {case: upper}}]
  AE_SEVERITY: [{transform_id: assign_ct, source_ref_ids: [ae_merged__AESEV], target_variables: [AESEV], parameters: {codelist_id: AESEV}}]
  AE_SERIOUS: [{transform_id: assign_ct, source_ref_ids: [ae_merged__AESER], target_variables: [AESER], parameters: {codelist_id: NY}}]
  AE_HOSPITALIZATION: [{transform_id: assign_ct, source_ref_ids: [ae_merged__AESHOSP], target_variables: [AESHOSP], parameters: {codelist_id: NY}}]
  AE_RELATIONSHIP: [{transform_id: assign_ct, source_ref_ids: [ae_merged__AEREL], target_variables: [AEREL], parameters: {codelist_id: AEREL}}]
  AE_OUTCOME: [{transform_id: assign_ct, source_ref_ids: [ae_merged__AEOUTCOME], target_variables: [AEOUT], parameters: {codelist_id: AEOUT}}]
  AE_START_DATETIME: [{transform_id: to_iso8601_partial_datetime, source_ref_ids: [ae_merged__AESTDAT, ae_merged__AESTTIM], target_variables: [AESTDTC], parameters: {formats: [dd-mmm-yyyy, 'H:M'], unknown_tokens: [UNK, UN]}}]
  AE_START_STUDY_DAY: [{transform_id: derive_study_day, source_ref_ids: [], target_variables: [AESTDY], parameters: {target_date: AESTDTC, reference_date: RFSTDTC}}]
  AE_END_DATETIME: [{transform_id: to_iso8601_partial_datetime, source_ref_ids: [ae_merged__AEENDDAT, ae_merged__AEENDTIM], target_variables: [AEENDTC], parameters: {formats: [dd-mmm-yyyy, 'H:M'], unknown_tokens: [UNK, UN]}}]
  AE_ONGOING_STATUS: [{transform_id: derive_ongoing_flag, source_ref_ids: [ae_merged__AEENDDAT, ae_merged__AEONGO], target_variables: [AEENRF], parameters: {ongoing_value: ONGOING, affirmative_values: ['Y', 'Yes']}}]
  AE_END_STUDY_DAY: [{transform_id: derive_study_day, source_ref_ids: [], target_variables: [AEENDY], parameters: {target_date: AEENDTC, reference_date: RFSTDTC}}]
  AE_SEQUENCE: [{transform_id: derive_sequence, source_ref_ids: [], target_variables: [AESEQ], parameters: {record_variables: [STUDYID, USUBJID, AESTDTC, AETERM, AEDECOD, .SOURCE_ROW], start_at: 1}}]
  VS_STUDY_IDENTIFIER: [{transform_id: assign_no_ct, source_ref_ids: [vs_mixed__STUDY], target_variables: [STUDYID], parameters: {}}]
  VS_DOMAIN_CONSTANT: [{transform_id: hardcode_no_ct, source_ref_ids: [], target_variables: [DOMAIN], parameters: {value: VS}}]
  VS_UNIQUE_SUBJECT_IDENTIFIER: [{transform_id: derive_usubjid, source_ref_ids: [vs_mixed__STUDY, vs_mixed__PATNUM], target_variables: [USUBJID], parameters: {separator: '-'}}]
  VS_VISIT: [{transform_id: assign_no_ct, source_ref_ids: [vs_mixed__INSTANCE], target_variables: [VISIT], parameters: {}}]
  VS_VISIT_NUMBER: [{transform_id: derive_visitnum, source_ref_ids: [vs_mixed__INSTANCE], target_variables: [VISITNUM], parameters: {visit_map_id: trace_visits_v1}}]
  VS_DATETIME: [{transform_id: to_iso8601_datetime, source_ref_ids: [vs_mixed__VTLD, vs_mixed__VSTIM], target_variables: [VSDTC], parameters: {formats: [dd-mmm-yyyy, 'H:M'], unknown_tokens: [UNK, UN]}}]
  VS_POSITION: [{transform_id: assign_ct, source_ref_ids: [vs_mixed__SUBPOS], target_variables: [VSPOS], parameters: {codelist_id: VSPOS}}]
  VS_HEIGHT_RECORD: [{transform_id: transpose_findings, source_ref_ids: [vs_mixed__HEIGHT, vs_mixed__HEIGHTU], target_variables: [VSTESTCD, VSTEST, VSORRES, VSORRESU], parameters: {test_code: HEIGHT, test_name: Height, original_unit: null, unit_source: HEIGHTU}}]
  VS_HEIGHT_STANDARDIZATION: [{transform_id: standardize_unit, source_ref_ids: [vs_mixed__HEIGHT, vs_mixed__HEIGHTU], target_variables: [VSSTRESC, VSSTRESN, VSSTRESU], parameters: {conversion_set_id: vs_standard_v1, target_unit: cm}}]
  VS_WEIGHT_RECORD: [{transform_id: transpose_findings, source_ref_ids: [vs_mixed__WEIGHT, vs_mixed__WEIGHTU], target_variables: [VSTESTCD, VSTEST, VSORRES, VSORRESU], parameters: {test_code: WEIGHT, test_name: Weight, original_unit: null, unit_source: WEIGHTU}}]
  VS_WEIGHT_STANDARDIZATION: [{transform_id: standardize_unit, source_ref_ids: [vs_mixed__WEIGHT, vs_mixed__WEIGHTU], target_variables: [VSSTRESC, VSSTRESN, VSSTRESU], parameters: {conversion_set_id: vs_standard_v1, target_unit: kg}}]
  VS_TEMP_RECORD: [{transform_id: transpose_findings, source_ref_ids: [vs_mixed__TEMP, vs_mixed__TEMPU], target_variables: [VSTESTCD, VSTEST, VSORRES, VSORRESU], parameters: {test_code: TEMP, test_name: Temperature, original_unit: null, unit_source: TEMPU}}]
  VS_TEMP_STANDARDIZATION: [{transform_id: standardize_unit, source_ref_ids: [vs_mixed__TEMP, vs_mixed__TEMPU], target_variables: [VSSTRESC, VSSTRESN, VSSTRESU], parameters: {conversion_set_id: vs_standard_v1, target_unit: C}}]
  VS_SYSBP_RECORD: [{transform_id: transpose_findings, source_ref_ids: [vs_mixed__SYS_BP, vs_mixed__SYS_BPU], target_variables: [VSTESTCD, VSTEST, VSORRES, VSORRESU], parameters: {test_code: SYSBP, test_name: Systolic Blood Pressure, original_unit: null, unit_source: SYS_BPU}}]
  VS_SYSBP_STANDARDIZATION: [{transform_id: standardize_unit, source_ref_ids: [vs_mixed__SYS_BP, vs_mixed__SYS_BPU], target_variables: [VSSTRESC, VSSTRESN, VSSTRESU], parameters: {conversion_set_id: vs_standard_v1, target_unit: mmHg}}]
  VS_DIABP_RECORD: [{transform_id: transpose_findings, source_ref_ids: [vs_mixed__DIA_BP, vs_mixed__DIA_BPU], target_variables: [VSTESTCD, VSTEST, VSORRES, VSORRESU], parameters: {test_code: DIABP, test_name: Diastolic Blood Pressure, original_unit: null, unit_source: DIA_BPU}}]
  VS_DIABP_STANDARDIZATION: [{transform_id: standardize_unit, source_ref_ids: [vs_mixed__DIA_BP, vs_mixed__DIA_BPU], target_variables: [VSSTRESC, VSSTRESN, VSSTRESU], parameters: {conversion_set_id: vs_standard_v1, target_unit: mmHg}}]
  VS_PULSE_RECORD: [{transform_id: transpose_findings, source_ref_ids: [vs_mixed__PULSE, vs_mixed__PULSEU], target_variables: [VSTESTCD, VSTEST, VSORRES, VSORRESU], parameters: {test_code: PULSE, test_name: Pulse Rate, original_unit: null, unit_source: PULSEU}}]
  VS_PULSE_STANDARDIZATION: [{transform_id: standardize_unit, source_ref_ids: [vs_mixed__PULSE, vs_mixed__PULSEU], target_variables: [VSSTRESC, VSSTRESN, VSSTRESU], parameters: {conversion_set_id: vs_standard_v1, target_unit: beats/min}}]
  VS_SEQUENCE: [{transform_id: derive_sequence, source_ref_ids: [], target_variables: [VSSEQ], parameters: {record_variables: [STUDYID, USUBJID, VSDTC, VSTESTCD, VSPOS, VISITNUM, .SOURCE_ROW], start_at: 1}}]
  VS_STUDY_DAY: [{transform_id: derive_study_day, source_ref_ids: [], target_variables: [VSDY], parameters: {target_date: VSDTC, reference_date: RFSTDTC}}]
  VS_BASELINE_FLAG: [{transform_id: derive_baseline_flag, source_ref_ids: [], target_variables: [VSBLFL], parameters: {reference_date: RFSTDTC, baseline_visits: [Screening 1], baseline_timepoints: []}}]
