schema_version: '0.4'
policy_version: 2.0.0
scenario: intermediate
identifiers:
  usubjid:
    components: [STUDY, PATNUM]
    separator: '-'
    missing_component_policy: reject
  subject_id: {source_variable: PATNUM}
  site_id: {source_variable: PATNUM, separator: '-', position: 1}
date_time_formats:
  evidence_contract: 字段画像属于观察证据；批准格式用于消除解析歧义，不提供完整函数链或目标变量集合。
  preserve_partial_dates: false
  prohibit_date_imputation: true
  time_ingestion: {normalized_data_type: hms, execution_format: 'H:M:S'}
  approved_sources:
    - {source: {dataset: dm_intermediate, variable: FIRST_DOSE_DATE}, semantic_type: complete_date, formats: [dd-mmm-yyyy]}
    - {source: {dataset: dm_intermediate, variable: FIRST_DOSE_TIME}, semantic_type: time, formats: ['H:M:S']}
    - {source: {dataset: dm_intermediate, variable: IC_DATE}, semantic_type: complete_date, formats: [dd-mmm-yyyy]}
    - {source: {dataset: ae_intermediate, variable: AESTDAT}, semantic_type: complete_date, formats: [dd-mmm-yyyy]}
    - {source: {dataset: ae_intermediate, variable: AESTTIM}, semantic_type: time, formats: ['H:M:S']}
    - {source: {dataset: ae_intermediate, variable: AEENDDAT}, semantic_type: optional_complete_date, formats: [dd-mmm-yyyy]}
    - {source: {dataset: ae_intermediate, variable: AEENDTIM}, semantic_type: optional_time, formats: ['H:M:S']}
    - {source: {dataset: vs_intermediate, variable: VSDAT}, semantic_type: complete_date, formats: [dd-mmm-yyyy]}
    - {source: {dataset: vs_intermediate, variable: VSTIM}, semantic_type: time, formats: ['H:M:S']}
upstream_outputs:
  reference_start:
    producer_task: DM_REFERENCE_START
    grain: one_record_per_subject
    keys: [STUDYID, USUBJID]
    available_fields: [RFSTDTC]
    downstream_use: [AE_study_day_reference, VS_study_day_reference]
sequence_rules:
  AE: {record_variables: [STUDYID, USUBJID, AESTDTC, AETERM, AEDECOD, .SOURCE_ROW], start_at: 1}
  VS: {record_variables: [STUDYID, USUBJID, VSDTC, VSTESTCD, VSPOS, VISITNUM, .SOURCE_ROW], start_at: 1}
baseline_rules: {}
unit_standardization:
  required: false
  identity_conversion_required: false
  standard_result_targets_in_scope: false
  findings:
    - {source_variable: HEIGHT, test_code: HEIGHT, test_name: Height, original_unit: cm, unit_source: null}
    - {source_variable: WEIGHT, test_code: WEIGHT, test_name: Weight, original_unit: kg, unit_source: null}
    - {source_variable: TEMP, test_code: TEMP, test_name: Temperature, original_unit: C, unit_source: null}
    - {source_variable: SYSBP, test_code: SYSBP, test_name: Systolic Blood Pressure, original_unit: mmHg, unit_source: null}
    - {source_variable: DIABP, test_code: DIABP, test_name: Diastolic Blood Pressure, original_unit: mmHg, unit_source: null}
    - {source_variable: PULSE, test_code: PULSE, test_name: Pulse Rate, original_unit: beats/min, unit_source: null}
dataset_output_contract:
  applies_when_output_mode: dataset
  target_variables: []
  dataset_name_parameter: output_dataset
  prohibit_dataset_name_in_target_variables: true
parameter_bindings:
  DM_DOMAIN_CONSTANT: {value: DM}
  DM_AGE_UNIT: {value: YEARS, codelist_id: AGEU}
  AE_DOMAIN_CONSTANT: {value: AE}
  AE_ONGOING_STATUS: {ongoing_value: ONGOING, affirmative_values: ['Yes']}
  VS_DOMAIN_CONSTANT: {value: VS}
