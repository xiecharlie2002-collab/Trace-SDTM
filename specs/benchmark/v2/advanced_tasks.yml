schema_version: '0.4'
specification:
  name: TraceSDTM v0.4 advanced atomic tasks
  version: 2.0.0
  status: frozen
  standard: SDTMIG 3.4
  scenario: advanced
  benchmark_level: advanced
  expected_task_count: 57
source_catalog:
  dm_subject: {file: dm_subject.csv, form_name: Demographics, grain: one_record_per_subject, keys: [STUDY, PATNUM]}
  ex_a_raw: {file: ex_a_raw.csv, form_name: Exposure A, grain: many_records_per_subject, keys: [STUDY, PATNUM]}
  ex_b_raw: {file: ex_b_raw.csv, form_name: Exposure B, grain: many_records_per_subject, keys: [STUDY, PATNUM]}
  ae_main: {file: ae_main.csv, form_name: Adverse Events, grain: one_record_per_event, keys: [STUDY, PATNUM, AEID]}
  sae_detail: {file: sae_detail.csv, form_name: Serious Adverse Event Details, grain: one_record_per_event, keys: [STUDY, PATNUM, AEID]}
  ae_merged: {derived: true, profile_parents: [ae_main, sae_detail], form_name: Adverse Events plus SAE Details, grain: one_record_per_event, keys: [STUDY, PATNUM, AEID]}
  vs_mixed: {file: vs_mixed.csv, form_name: Vital Signs, grain: one_record_per_subject_visit, keys: [STUDY, PATNUM, INSTANCE]}
domain_sources: {DM: dm_subject, AE: ae_main, VS: vs_mixed}
tasks:
  # DM: 17 actions in the five legacy assembly groups
  - {task_id: DM_STUDY_IDENTIFIER, assembly_group_id: DM_CORE, target_domain: DM, form_name: Demographics, source_refs: [{ref_id: dm_subject__STUDY, dataset: dm_subject, variable: STUDY, role: study_identifier}], depends_on: [], required: true, intent: Map the study identifier.}
  - {task_id: DM_DOMAIN_CONSTANT, assembly_group_id: DM_CORE, target_domain: DM, form_name: Demographics, source_refs: [], depends_on: [], required: true, intent: Set the DM domain constant.}
  - task_id: DM_UNIQUE_SUBJECT_IDENTIFIER
    assembly_group_id: DM_CORE
    target_domain: DM
    form_name: Demographics
    source_refs:
      - {ref_id: dm_subject__STUDY, dataset: dm_subject, variable: STUDY, role: study_identifier}
      - {ref_id: dm_subject__PATNUM, dataset: dm_subject, variable: PATNUM, role: subject_identifier}
    depends_on: []
    required: true
    intent: Derive the unique subject identifier.
  - {task_id: DM_SUBJECT_IDENTIFIER, assembly_group_id: DM_CORE, target_domain: DM, form_name: Demographics, source_refs: [{ref_id: dm_subject__PATNUM, dataset: dm_subject, variable: PATNUM, role: subject_identifier}], depends_on: [], required: true, intent: Map the sponsor subject identifier.}
  - {task_id: DM_SITE_IDENTIFIER, assembly_group_id: DM_CORE, target_domain: DM, form_name: Demographics, source_refs: [{ref_id: dm_subject__PATNUM, dataset: dm_subject, variable: PATNUM, role: site_and_subject_identifier}], depends_on: [], required: true, intent: Extract the site identifier from the sponsor subject identifier.}
  - task_id: DM_REFERENCE_START
    assembly_group_id: DM_REFERENCE_START
    target_domain: DM
    form_name: Exposure A plus Exposure B
    source_refs:
      - {ref_id: ex_a_raw__EXSTDAT, dataset: ex_a_raw, variable: EXSTDAT, role: date}
      - {ref_id: ex_a_raw__EXSTTIM, dataset: ex_a_raw, variable: EXSTTIM, role: time}
      - {ref_id: ex_b_raw__DOSE_DATE, dataset: ex_b_raw, variable: DOSE_DATE, role: date}
      - {ref_id: ex_b_raw__DOSE_TIME, dataset: ex_b_raw, variable: DOSE_TIME, role: time}
    depends_on: [DM_UNIQUE_SUBJECT_IDENTIFIER]
    required: true
    intent: Derive the earliest subject reference-start datetime from both exposure sources.
  - {task_id: DM_CONSENT, assembly_group_id: DM_CONSENT, target_domain: DM, form_name: Demographics, source_refs: [{ref_id: dm_subject__IC_DT, dataset: dm_subject, variable: IC_DT, role: date}], depends_on: [DM_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Convert informed consent date to ISO 8601.}
  - {task_id: DM_AGE, assembly_group_id: DM_DEMOGRAPHICS, target_domain: DM, form_name: Demographics, source_refs: [{ref_id: dm_subject__AGE, dataset: dm_subject, variable: AGE, role: age}], depends_on: [DM_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map age.}
  - {task_id: DM_AGE_UNIT, assembly_group_id: DM_DEMOGRAPHICS, target_domain: DM, form_name: Demographics, source_refs: [], depends_on: [DM_AGE], required: true, intent: Set the controlled age unit.}
  - {task_id: DM_SEX, assembly_group_id: DM_DEMOGRAPHICS, target_domain: DM, form_name: Demographics, source_refs: [{ref_id: dm_subject__SEX, dataset: dm_subject, variable: SEX, role: sex}], depends_on: [DM_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map sex using controlled terminology.}
  - {task_id: DM_ETHNICITY, assembly_group_id: DM_DEMOGRAPHICS, target_domain: DM, form_name: Demographics, source_refs: [{ref_id: dm_subject__ETHNIC, dataset: dm_subject, variable: ETHNIC, role: ethnicity}], depends_on: [DM_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map ethnicity using controlled terminology.}
  - {task_id: DM_RACE, assembly_group_id: DM_DEMOGRAPHICS, target_domain: DM, form_name: Demographics, source_refs: [{ref_id: dm_subject__RACE, dataset: dm_subject, variable: RACE, role: race}], depends_on: [DM_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map race using controlled terminology.}
  - {task_id: DM_COUNTRY, assembly_group_id: DM_DEMOGRAPHICS, target_domain: DM, form_name: Demographics, source_refs: [{ref_id: dm_subject__COUNTRY, dataset: dm_subject, variable: COUNTRY, role: country}], depends_on: [DM_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map country.}
  - {task_id: DM_PLANNED_ARM_CODE, assembly_group_id: DM_TREATMENT, target_domain: DM, form_name: Demographics, source_refs: [{ref_id: dm_subject__PLANNED_ARMCD, dataset: dm_subject, variable: PLANNED_ARMCD, role: planned_arm_code}], depends_on: [DM_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map the planned arm code.}
  - {task_id: DM_PLANNED_ARM, assembly_group_id: DM_TREATMENT, target_domain: DM, form_name: Demographics, source_refs: [{ref_id: dm_subject__PLANNED_ARM, dataset: dm_subject, variable: PLANNED_ARM, role: planned_arm}], depends_on: [DM_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map the planned arm description.}
  - {task_id: DM_ACTUAL_ARM_CODE, assembly_group_id: DM_TREATMENT, target_domain: DM, form_name: Demographics, source_refs: [{ref_id: dm_subject__ACTUAL_ARMCD, dataset: dm_subject, variable: ACTUAL_ARMCD, role: actual_arm_code}], depends_on: [DM_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map the actual arm code.}
  - {task_id: DM_ACTUAL_ARM, assembly_group_id: DM_TREATMENT, target_domain: DM, form_name: Demographics, source_refs: [{ref_id: dm_subject__ACTUAL_ARM, dataset: dm_subject, variable: ACTUAL_ARM, role: actual_arm}], depends_on: [DM_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map the actual arm description.}
  # AE: source integration plus 17 mapping and derivation actions
  - task_id: AE_SOURCE_INTEGRATION
    assembly_group_id: AE_SOURCE_INTEGRATION
    target_domain: AE
    form_name: Adverse Events plus SAE Details
    source_refs:
      - {ref_id: ae_main__STUDY, dataset: ae_main, variable: STUDY, role: join_key}
      - {ref_id: ae_main__PATNUM, dataset: ae_main, variable: PATNUM, role: join_key}
      - {ref_id: ae_main__AEID, dataset: ae_main, variable: AEID, role: join_key}
      - {ref_id: sae_detail__STUDY, dataset: sae_detail, variable: STUDY, role: join_key}
      - {ref_id: sae_detail__PATNUM, dataset: sae_detail, variable: PATNUM, role: join_key}
      - {ref_id: sae_detail__AEID, dataset: sae_detail, variable: AEID, role: join_key}
      - {ref_id: sae_detail__AESHOSP, dataset: sae_detail, variable: AESHOSP, role: hospitalization_indicator}
    depends_on: []
    required: true
    intent: Left-join SAE hospitalization details onto the event-level AE source with a verified one-to-one relationship.
  - {task_id: AE_STUDY_IDENTIFIER, assembly_group_id: AE_CORE, target_domain: AE, form_name: Adverse Events, source_refs: [{ref_id: ae_merged__STUDY, dataset: ae_merged, variable: STUDY, role: study_identifier}], depends_on: [AE_SOURCE_INTEGRATION, DM_STUDY_IDENTIFIER], required: true, intent: Map the study identifier to AE.}
  - {task_id: AE_DOMAIN_CONSTANT, assembly_group_id: AE_CORE, target_domain: AE, form_name: Adverse Events, source_refs: [], depends_on: [AE_SOURCE_INTEGRATION], required: true, intent: Set the AE domain constant.}
  - task_id: AE_UNIQUE_SUBJECT_IDENTIFIER
    assembly_group_id: AE_CORE
    target_domain: AE
    form_name: Adverse Events
    source_refs:
      - {ref_id: ae_merged__STUDY, dataset: ae_merged, variable: STUDY, role: study_identifier}
      - {ref_id: ae_merged__PATNUM, dataset: ae_merged, variable: PATNUM, role: subject_identifier}
    depends_on: [AE_SOURCE_INTEGRATION, DM_UNIQUE_SUBJECT_IDENTIFIER]
    required: true
    intent: Derive the unique subject identifier for AE.
  - {task_id: AE_REPORTED_TERM, assembly_group_id: AE_TERMS, target_domain: AE, form_name: Adverse Events, source_refs: [{ref_id: ae_merged__AETERM, dataset: ae_merged, variable: AETERM, role: reported_term}], depends_on: [AE_SOURCE_INTEGRATION], required: true, intent: Map the reported adverse event term.}
  - {task_id: AE_CODED_TERM, assembly_group_id: AE_TERMS, target_domain: AE, form_name: Adverse Events, source_refs: [{ref_id: ae_merged__AEDECOD, dataset: ae_merged, variable: AEDECOD, role: coded_term}], depends_on: [AE_SOURCE_INTEGRATION], required: true, intent: Map the coded adverse event term.}
  - {task_id: AE_BODY_SYSTEM, assembly_group_id: AE_TERMS, target_domain: AE, form_name: Adverse Events, source_refs: [{ref_id: ae_merged__AEBODSYS, dataset: ae_merged, variable: AEBODSYS, role: body_system}], depends_on: [AE_SOURCE_INTEGRATION], required: true, intent: Normalize and map the body system term.}
  - {task_id: AE_SEVERITY, assembly_group_id: AE_SAFETY, target_domain: AE, form_name: Adverse Events, source_refs: [{ref_id: ae_merged__AESEV, dataset: ae_merged, variable: AESEV, role: severity}], depends_on: [AE_SOURCE_INTEGRATION], required: true, intent: Map adverse event severity.}
  - {task_id: AE_SERIOUS, assembly_group_id: AE_SAFETY, target_domain: AE, form_name: Adverse Events, source_refs: [{ref_id: ae_merged__AESER, dataset: ae_merged, variable: AESER, role: serious_indicator}], depends_on: [AE_SOURCE_INTEGRATION], required: true, intent: Map the serious-event indicator.}
  - {task_id: AE_HOSPITALIZATION, assembly_group_id: AE_SAFETY, target_domain: AE, form_name: Adverse Events plus SAE Details, source_refs: [{ref_id: ae_merged__AESHOSP, dataset: ae_merged, variable: AESHOSP, role: hospitalization_indicator}], depends_on: [AE_SOURCE_INTEGRATION], required: true, intent: Map the hospitalization indicator.}
  - {task_id: AE_RELATIONSHIP, assembly_group_id: AE_REL_OUTCOME, target_domain: AE, form_name: Adverse Events, source_refs: [{ref_id: ae_merged__AEREL, dataset: ae_merged, variable: AEREL, role: causality}], depends_on: [AE_SOURCE_INTEGRATION], required: true, intent: Map relationship to study treatment.}
  - {task_id: AE_OUTCOME, assembly_group_id: AE_REL_OUTCOME, target_domain: AE, form_name: Adverse Events, source_refs: [{ref_id: ae_merged__AEOUTCOME, dataset: ae_merged, variable: AEOUTCOME, role: outcome}], depends_on: [AE_SOURCE_INTEGRATION], required: true, intent: Map adverse event outcome.}
  - task_id: AE_START_DATETIME
    assembly_group_id: AE_START
    target_domain: AE
    form_name: Adverse Events
    source_refs:
      - {ref_id: ae_merged__AESTDAT, dataset: ae_merged, variable: AESTDAT, role: partial_date}
      - {ref_id: ae_merged__AESTTIM, dataset: ae_merged, variable: AESTTIM, role: optional_time}
    depends_on: [AE_SOURCE_INTEGRATION, AE_UNIQUE_SUBJECT_IDENTIFIER]
    required: true
    intent: Preserve the maximum known precision while combining partial start date and optional time.
  - {task_id: AE_START_STUDY_DAY, assembly_group_id: AE_START, target_domain: AE, form_name: Adverse Events, source_refs: [], depends_on: [AE_START_DATETIME, DM_REFERENCE_START], required: true, intent: Derive start study day only when the start date is complete.}
  - task_id: AE_END_DATETIME
    assembly_group_id: AE_END
    target_domain: AE
    form_name: Adverse Events
    source_refs:
      - {ref_id: ae_merged__AEENDDAT, dataset: ae_merged, variable: AEENDDAT, role: partial_date}
      - {ref_id: ae_merged__AEENDTIM, dataset: ae_merged, variable: AEENDTIM, role: optional_time}
    depends_on: [AE_SOURCE_INTEGRATION, AE_UNIQUE_SUBJECT_IDENTIFIER]
    required: true
    intent: Preserve the maximum known precision while combining partial end date and optional time.
  - task_id: AE_ONGOING_STATUS
    assembly_group_id: AE_END
    target_domain: AE
    form_name: Adverse Events
    source_refs:
      - {ref_id: ae_merged__AEENDDAT, dataset: ae_merged, variable: AEENDDAT, role: end_date}
      - {ref_id: ae_merged__AEONGO, dataset: ae_merged, variable: AEONGO, role: ongoing_indicator}
    depends_on: [AE_SOURCE_INTEGRATION]
    required: true
    intent: Derive the SDTM ongoing-event reference value.
  - {task_id: AE_END_STUDY_DAY, assembly_group_id: AE_END, target_domain: AE, form_name: Adverse Events, source_refs: [], depends_on: [AE_END_DATETIME, DM_REFERENCE_START], required: true, intent: Derive end study day only when the end date is complete.}
  - {task_id: AE_SEQUENCE, assembly_group_id: AE_SEQUENCE, target_domain: AE, form_name: Adverse Events, source_refs: [], depends_on: [AE_UNIQUE_SUBJECT_IDENTIFIER, AE_REPORTED_TERM, AE_CODED_TERM, AE_START_DATETIME], required: true, intent: Derive a stable within-subject AE sequence.}
  # VS: seven core actions
  - {task_id: VS_STUDY_IDENTIFIER, assembly_group_id: VS_CORE, target_domain: VS, form_name: Vital Signs, source_refs: [{ref_id: vs_mixed__STUDY, dataset: vs_mixed, variable: STUDY, role: study_identifier}], depends_on: [DM_STUDY_IDENTIFIER], required: true, intent: Map the study identifier to VS.}
  - {task_id: VS_DOMAIN_CONSTANT, assembly_group_id: VS_CORE, target_domain: VS, form_name: Vital Signs, source_refs: [], depends_on: [], required: true, intent: Set the VS domain constant.}
  - task_id: VS_UNIQUE_SUBJECT_IDENTIFIER
    assembly_group_id: VS_CORE
    target_domain: VS
    form_name: Vital Signs
    source_refs:
      - {ref_id: vs_mixed__STUDY, dataset: vs_mixed, variable: STUDY, role: study_identifier}
      - {ref_id: vs_mixed__PATNUM, dataset: vs_mixed, variable: PATNUM, role: subject_identifier}
    depends_on: [DM_UNIQUE_SUBJECT_IDENTIFIER]
    required: true
    intent: Derive the unique subject identifier for VS.
  - {task_id: VS_VISIT, assembly_group_id: VS_CORE, target_domain: VS, form_name: Vital Signs, source_refs: [{ref_id: vs_mixed__INSTANCE, dataset: vs_mixed, variable: INSTANCE, role: visit}], depends_on: [VS_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map the visit name.}
  - {task_id: VS_VISIT_NUMBER, assembly_group_id: VS_CORE, target_domain: VS, form_name: Vital Signs, source_refs: [{ref_id: vs_mixed__INSTANCE, dataset: vs_mixed, variable: INSTANCE, role: visit}], depends_on: [VS_VISIT], required: true, intent: Derive the numeric visit value from the approved visit table.}
  - task_id: VS_DATETIME
    assembly_group_id: VS_CORE
    target_domain: VS
    form_name: Vital Signs
    source_refs:
      - {ref_id: vs_mixed__VTLD, dataset: vs_mixed, variable: VTLD, role: date}
      - {ref_id: vs_mixed__VSTIM, dataset: vs_mixed, variable: VSTIM, role: time}
    depends_on: [VS_UNIQUE_SUBJECT_IDENTIFIER]
    required: true
    intent: Combine vital signs date and time as ISO 8601 datetime.
  - {task_id: VS_POSITION, assembly_group_id: VS_CORE, target_domain: VS, form_name: Vital Signs, source_refs: [{ref_id: vs_mixed__SUBPOS, dataset: vs_mixed, variable: SUBPOS, role: body_position}], depends_on: [VS_UNIQUE_SUBJECT_IDENTIFIER], required: true, intent: Map body position using controlled terminology.}
  # Each advanced finding is split into record expansion and standardization.
  - task_id: VS_HEIGHT_RECORD
    assembly_group_id: VS_HEIGHT
    target_domain: VS
    form_name: Vital Signs
    source_refs: [{ref_id: vs_mixed__HEIGHT, dataset: vs_mixed, variable: HEIGHT, role: result}, {ref_id: vs_mixed__HEIGHTU, dataset: vs_mixed, variable: HEIGHTU, role: original_unit}]
    depends_on: [VS_DATETIME]
    required: true
    intent: Expand height and its original unit into one VS finding record.
  - task_id: VS_HEIGHT_STANDARDIZATION
    assembly_group_id: VS_HEIGHT
    target_domain: VS
    form_name: Vital Signs
    source_refs: [{ref_id: vs_mixed__HEIGHT, dataset: vs_mixed, variable: HEIGHT, role: result}, {ref_id: vs_mixed__HEIGHTU, dataset: vs_mixed, variable: HEIGHTU, role: original_unit}]
    depends_on: [VS_HEIGHT_RECORD]
    required: true
    intent: Standardize height to the registered standard unit.
  - task_id: VS_WEIGHT_RECORD
    assembly_group_id: VS_WEIGHT
    target_domain: VS
    form_name: Vital Signs
    source_refs: [{ref_id: vs_mixed__WEIGHT, dataset: vs_mixed, variable: WEIGHT, role: result}, {ref_id: vs_mixed__WEIGHTU, dataset: vs_mixed, variable: WEIGHTU, role: original_unit}]
    depends_on: [VS_DATETIME]
    required: true
    intent: Expand weight and its original unit into one VS finding record.
  - task_id: VS_WEIGHT_STANDARDIZATION
    assembly_group_id: VS_WEIGHT
    target_domain: VS
    form_name: Vital Signs
    source_refs: [{ref_id: vs_mixed__WEIGHT, dataset: vs_mixed, variable: WEIGHT, role: result}, {ref_id: vs_mixed__WEIGHTU, dataset: vs_mixed, variable: WEIGHTU, role: original_unit}]
    depends_on: [VS_WEIGHT_RECORD]
    required: true
    intent: Standardize weight to the registered standard unit.
  - task_id: VS_TEMP_RECORD
    assembly_group_id: VS_TEMP
    target_domain: VS
    form_name: Vital Signs
    source_refs: [{ref_id: vs_mixed__TEMP, dataset: vs_mixed, variable: TEMP, role: result}, {ref_id: vs_mixed__TEMPU, dataset: vs_mixed, variable: TEMPU, role: original_unit}]
    depends_on: [VS_DATETIME]
    required: true
    intent: Expand temperature and its original unit into one VS finding record.
  - task_id: VS_TEMP_STANDARDIZATION
    assembly_group_id: VS_TEMP
    target_domain: VS
    form_name: Vital Signs
    source_refs: [{ref_id: vs_mixed__TEMP, dataset: vs_mixed, variable: TEMP, role: result}, {ref_id: vs_mixed__TEMPU, dataset: vs_mixed, variable: TEMPU, role: original_unit}]
    depends_on: [VS_TEMP_RECORD]
    required: true
    intent: Standardize temperature to the registered standard unit.
  - task_id: VS_SYSBP_RECORD
    assembly_group_id: VS_SYSBP
    target_domain: VS
    form_name: Vital Signs
    source_refs: [{ref_id: vs_mixed__SYS_BP, dataset: vs_mixed, variable: SYS_BP, role: result}, {ref_id: vs_mixed__SYS_BPU, dataset: vs_mixed, variable: SYS_BPU, role: original_unit}]
    depends_on: [VS_DATETIME]
    required: true
    intent: Expand systolic blood pressure and its original unit into one VS finding record.
  - task_id: VS_SYSBP_STANDARDIZATION
    assembly_group_id: VS_SYSBP
    target_domain: VS
    form_name: Vital Signs
    source_refs: [{ref_id: vs_mixed__SYS_BP, dataset: vs_mixed, variable: SYS_BP, role: result}, {ref_id: vs_mixed__SYS_BPU, dataset: vs_mixed, variable: SYS_BPU, role: original_unit}]
    depends_on: [VS_SYSBP_RECORD]
    required: true
    intent: Normalize systolic blood pressure through the registered identity conversion.
  - task_id: VS_DIABP_RECORD
    assembly_group_id: VS_DIABP
    target_domain: VS
    form_name: Vital Signs
    source_refs: [{ref_id: vs_mixed__DIA_BP, dataset: vs_mixed, variable: DIA_BP, role: result}, {ref_id: vs_mixed__DIA_BPU, dataset: vs_mixed, variable: DIA_BPU, role: original_unit}]
    depends_on: [VS_DATETIME]
    required: true
    intent: Expand diastolic blood pressure and its original unit into one VS finding record.
  - task_id: VS_DIABP_STANDARDIZATION
    assembly_group_id: VS_DIABP
    target_domain: VS
    form_name: Vital Signs
    source_refs: [{ref_id: vs_mixed__DIA_BP, dataset: vs_mixed, variable: DIA_BP, role: result}, {ref_id: vs_mixed__DIA_BPU, dataset: vs_mixed, variable: DIA_BPU, role: original_unit}]
    depends_on: [VS_DIABP_RECORD]
    required: true
    intent: Normalize diastolic blood pressure through the registered identity conversion.
  - task_id: VS_PULSE_RECORD
    assembly_group_id: VS_PULSE
    target_domain: VS
    form_name: Vital Signs
    source_refs: [{ref_id: vs_mixed__PULSE, dataset: vs_mixed, variable: PULSE, role: result}, {ref_id: vs_mixed__PULSEU, dataset: vs_mixed, variable: PULSEU, role: original_unit}]
    depends_on: [VS_DATETIME]
    required: true
    intent: Expand pulse rate and its original unit into one VS finding record.
  - task_id: VS_PULSE_STANDARDIZATION
    assembly_group_id: VS_PULSE
    target_domain: VS
    form_name: Vital Signs
    source_refs: [{ref_id: vs_mixed__PULSE, dataset: vs_mixed, variable: PULSE, role: result}, {ref_id: vs_mixed__PULSEU, dataset: vs_mixed, variable: PULSEU, role: original_unit}]
    depends_on: [VS_PULSE_RECORD]
    required: true
    intent: Normalize pulse rate through the registered identity conversion.
  - {task_id: VS_SEQUENCE, assembly_group_id: VS_POST_DERIVATIONS, target_domain: VS, form_name: Vital Signs, source_refs: [], depends_on: [VS_HEIGHT_RECORD, VS_WEIGHT_RECORD, VS_TEMP_RECORD, VS_SYSBP_RECORD, VS_DIABP_RECORD, VS_PULSE_RECORD], required: true, intent: Derive a stable within-subject VS sequence.}
  - {task_id: VS_STUDY_DAY, assembly_group_id: VS_POST_DERIVATIONS, target_domain: VS, form_name: Vital Signs, source_refs: [], depends_on: [VS_DATETIME, DM_REFERENCE_START], required: true, intent: Derive the vital signs study day.}
  - {task_id: VS_BASELINE_FLAG, assembly_group_id: VS_POST_DERIVATIONS, target_domain: VS, form_name: Vital Signs, source_refs: [], depends_on: [VS_DATETIME, VS_VISIT, DM_REFERENCE_START, VS_HEIGHT_RECORD, VS_WEIGHT_RECORD, VS_TEMP_RECORD, VS_SYSBP_RECORD, VS_DIABP_RECORD, VS_PULSE_RECORD], required: true, intent: Flag the last valid Screening 1 result before the subject reference start.}
