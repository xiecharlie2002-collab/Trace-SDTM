schema_version: '0.2'
specification:
  name: TraceSDTM basic concept specification
  version: 0.2.0
  status: draft
  standard: SDTMIG 3.4
  scenario: basic
  approval: {reviewer: null, approved_at: null, review_workbook_sha256: null}
source_catalog:
  dm_raw: {file: dm_raw.csv, form_name: Demographics, grain: one_record_per_subject, keys: [STUDY, PATNUM]}
  ae_raw: {file: ae_raw.csv, form_name: Adverse Events, grain: one_record_per_event, keys: [STUDY, PATNUM]}
  vs_raw: {file: vs_raw.csv, form_name: Vital Signs, grain: one_record_per_subject_visit, keys: [STUDY, PATNUM, INSTANCE]}
domain_sources: {DM: dm_raw, AE: ae_raw, VS: vs_raw}
concepts:
  - concept_id: DM_CORE
    target_domain: DM
    form_name: Demographics
    source_refs: [{dataset: dm_raw, variable: STUDY, role: study_identifier}, {dataset: dm_raw, variable: PATNUM, role: subject_identifier}]
    depends_on: []
    expected_cardinality: one_record_to_one_record
    required: true
  - concept_id: DM_DATES
    target_domain: DM
    form_name: Demographics
    source_refs: [{dataset: dm_raw, variable: FIRST_DOSE_DT, role: reference_start}, {dataset: dm_raw, variable: IC_DT, role: informed_consent}]
    depends_on: [DM_CORE]
    expected_cardinality: one_record_to_one_record
    required: true
  - concept_id: DM_DEMOGRAPHICS
    target_domain: DM
    form_name: Demographics
    source_refs: [{dataset: dm_raw, variable: IT.AGE, role: age}, {dataset: dm_raw, variable: IT.SEX, role: sex}, {dataset: dm_raw, variable: IT.ETHNIC, role: ethnicity}, {dataset: dm_raw, variable: IT.RACE, role: race}, {dataset: dm_raw, variable: COUNTRY, role: country}]
    depends_on: [DM_CORE]
    expected_cardinality: one_record_to_one_record
    required: true
  - concept_id: DM_TREATMENT
    target_domain: DM
    form_name: Demographics
    source_refs: [{dataset: dm_raw, variable: PLANNED_ARMCD, role: planned_arm_code}, {dataset: dm_raw, variable: PLANNED_ARM, role: planned_arm}, {dataset: dm_raw, variable: ACTUAL_ARMCD, role: actual_arm_code}, {dataset: dm_raw, variable: ACTUAL_ARM, role: actual_arm}]
    depends_on: [DM_CORE]
    expected_cardinality: one_record_to_one_record
    required: true
  - concept_id: AE_CORE
    target_domain: AE
    form_name: Adverse Events
    source_refs: [{dataset: ae_raw, variable: STUDY, role: study_identifier}, {dataset: ae_raw, variable: PATNUM, role: subject_identifier}]
    depends_on: [DM_CORE]
    expected_cardinality: one_record_to_one_record
    required: true
  - concept_id: AE_TERMS
    target_domain: AE
    form_name: Adverse Events
    source_refs: [{dataset: ae_raw, variable: IT.AETERM, role: reported_term}, {dataset: ae_raw, variable: AEDECOD, role: coded_term}, {dataset: ae_raw, variable: AEBODSYS, role: body_system}]
    depends_on: [AE_CORE]
    expected_cardinality: one_record_to_one_record
    required: true
  - concept_id: AE_SAFETY
    target_domain: AE
    form_name: Adverse Events
    source_refs: [{dataset: ae_raw, variable: IT.AESEV, role: severity}, {dataset: ae_raw, variable: IT.AESER, role: serious_indicator}, {dataset: ae_raw, variable: IT.AESHOSP, role: hospitalization_indicator}]
    depends_on: [AE_CORE]
    expected_cardinality: one_record_to_one_record
    required: true
  - concept_id: AE_REL_OUTCOME
    target_domain: AE
    form_name: Adverse Events
    source_refs: [{dataset: ae_raw, variable: IT.AEREL, role: causality}, {dataset: ae_raw, variable: AEOUTCOME, role: outcome}]
    depends_on: [AE_CORE]
    expected_cardinality: one_record_to_one_record
    required: true
  - concept_id: AE_DATES
    target_domain: AE
    form_name: Adverse Events
    source_refs: [{dataset: ae_raw, variable: IT.AESTDAT, role: start_date}, {dataset: ae_raw, variable: IT.AEENDAT, role: end_date}]
    depends_on: [AE_CORE, DM_DATES]
    expected_cardinality: one_record_to_one_record
    required: true
  - concept_id: AE_SEQUENCE
    target_domain: AE
    form_name: Adverse Events
    source_refs: []
    depends_on: [AE_TERMS, AE_DATES]
    expected_cardinality: domain_post_derivation
    required: true
  - concept_id: VS_CORE
    target_domain: VS
    form_name: Vital Signs
    source_refs: [{dataset: vs_raw, variable: STUDY, role: study_identifier}, {dataset: vs_raw, variable: PATNUM, role: subject_identifier}, {dataset: vs_raw, variable: INSTANCE, role: visit}, {dataset: vs_raw, variable: VTLD, role: date}, {dataset: vs_raw, variable: SUBPOS, role: body_position}]
    depends_on: [DM_DATES]
    expected_cardinality: one_record_to_many_findings
    required: true
  - concept_id: VS_HEIGHT
    target_domain: VS
    form_name: Vital Signs
    source_refs: [{dataset: vs_raw, variable: IT.HEIGHT_VSORRES, role: result}]
    depends_on: [VS_CORE]
    expected_cardinality: one_observed_value_to_one_record
    required: true
  - concept_id: VS_WEIGHT
    target_domain: VS
    form_name: Vital Signs
    source_refs: [{dataset: vs_raw, variable: IT.WEIGHT, role: result}]
    depends_on: [VS_CORE]
    expected_cardinality: one_observed_value_to_one_record
    required: true
  - concept_id: VS_TEMP
    target_domain: VS
    form_name: Vital Signs
    source_refs: [{dataset: vs_raw, variable: IT.TEMP, role: result}]
    depends_on: [VS_CORE]
    expected_cardinality: one_observed_value_to_one_record
    required: true
  - concept_id: VS_SYSBP
    target_domain: VS
    form_name: Vital Signs
    source_refs: [{dataset: vs_raw, variable: SYS_BP, role: result}]
    depends_on: [VS_CORE]
    expected_cardinality: one_observed_value_to_one_record
    required: true
  - concept_id: VS_DIABP
    target_domain: VS
    form_name: Vital Signs
    source_refs: [{dataset: vs_raw, variable: DIA_BP, role: result}]
    depends_on: [VS_CORE]
    expected_cardinality: one_observed_value_to_one_record
    required: true
  - concept_id: VS_PULSE
    target_domain: VS
    form_name: Vital Signs
    source_refs: [{dataset: vs_raw, variable: PULSE, role: result}]
    depends_on: [VS_CORE]
    expected_cardinality: one_observed_value_to_one_record
    required: true
  - concept_id: VS_POST_DERIVATIONS
    target_domain: VS
    form_name: Vital Signs
    source_refs: []
    depends_on: [VS_HEIGHT, VS_WEIGHT, VS_TEMP, VS_SYSBP, VS_DIABP, VS_PULSE]
    expected_cardinality: domain_post_derivation
    required: true
