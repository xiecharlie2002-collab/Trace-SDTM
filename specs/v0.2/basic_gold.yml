schema_version: '0.2'
plans:
  DM_CORE:
    - {transform_id: assign_no_ct, source_keys: [dm_raw.STUDY], target_variables: [STUDYID], parameters: {}}
    - {transform_id: hardcode_no_ct, source_keys: [], target_variables: [DOMAIN], parameters: {value: DM}}
    - {transform_id: derive_usubjid, source_keys: [dm_raw.STUDY, dm_raw.PATNUM], target_variables: [USUBJID], parameters: {separator: '-'}}
    - {transform_id: assign_no_ct, source_keys: [dm_raw.PATNUM], target_variables: [SUBJID], parameters: {}}
    - {transform_id: extract_delimited_part, source_keys: [dm_raw.PATNUM], target_variables: [SITEID], parameters: {separator: '-', position: 1}}
  DM_DATES:
    - {transform_id: to_iso8601_date, source_keys: [dm_raw.FIRST_DOSE_DT], target_variables: [RFSTDTC], parameters: {formats: [m/d/y, dd-mmm-yyyy, y-m-d]}}
    - {transform_id: to_iso8601_date, source_keys: [dm_raw.IC_DT], target_variables: [RFICDTC], parameters: {formats: [m/d/y, dd-mmm-yyyy, y-m-d]}}
  DM_DEMOGRAPHICS:
    - {transform_id: assign_no_ct, source_keys: [dm_raw.IT.AGE], target_variables: [AGE], parameters: {}}
    - {transform_id: hardcode_ct, source_keys: [], target_variables: [AGEU], parameters: {value: YEARS, codelist_id: AGEU}}
    - {transform_id: assign_ct, source_keys: [dm_raw.IT.SEX], target_variables: [SEX], parameters: {codelist_id: SEX}}
    - {transform_id: assign_ct, source_keys: [dm_raw.IT.ETHNIC], target_variables: [ETHNIC], parameters: {codelist_id: ETHNIC}}
    - {transform_id: assign_ct, source_keys: [dm_raw.IT.RACE], target_variables: [RACE], parameters: {codelist_id: RACE}}
    - {transform_id: assign_no_ct, source_keys: [dm_raw.COUNTRY], target_variables: [COUNTRY], parameters: {}}
  DM_TREATMENT:
    - {transform_id: assign_no_ct, source_keys: [dm_raw.PLANNED_ARMCD], target_variables: [ARMCD], parameters: {}}
    - {transform_id: assign_no_ct, source_keys: [dm_raw.PLANNED_ARM], target_variables: [ARM], parameters: {}}
    - {transform_id: assign_no_ct, source_keys: [dm_raw.ACTUAL_ARMCD], target_variables: [ACTARMCD], parameters: {}}
    - {transform_id: assign_no_ct, source_keys: [dm_raw.ACTUAL_ARM], target_variables: [ACTARM], parameters: {}}
  AE_CORE:
    - {transform_id: assign_no_ct, source_keys: [ae_raw.STUDY], target_variables: [STUDYID], parameters: {}}
    - {transform_id: hardcode_no_ct, source_keys: [], target_variables: [DOMAIN], parameters: {value: AE}}
    - {transform_id: derive_usubjid, source_keys: [ae_raw.STUDY, ae_raw.PATNUM], target_variables: [USUBJID], parameters: {separator: '-'}}
  AE_TERMS:
    - {transform_id: assign_no_ct, source_keys: [ae_raw.IT.AETERM], target_variables: [AETERM], parameters: {}}
    - {transform_id: assign_no_ct, source_keys: [ae_raw.AEDECOD], target_variables: [AEDECOD], parameters: {}}
    - {transform_id: normalize_case, source_keys: [ae_raw.AEBODSYS], target_variables: [AEBODSYS], parameters: {case: upper}}
  AE_SAFETY:
    - {transform_id: assign_ct, source_keys: [ae_raw.IT.AESEV], target_variables: [AESEV], parameters: {codelist_id: AESEV}}
    - {transform_id: assign_ct, source_keys: [ae_raw.IT.AESER], target_variables: [AESER], parameters: {codelist_id: NY}}
    - {transform_id: assign_ct, source_keys: [ae_raw.IT.AESHOSP], target_variables: [AESHOSP], parameters: {codelist_id: NY}}
  AE_REL_OUTCOME:
    - {transform_id: assign_ct, source_keys: [ae_raw.IT.AEREL], target_variables: [AEREL], parameters: {codelist_id: AEREL}}
    - {transform_id: assign_ct, source_keys: [ae_raw.AEOUTCOME], target_variables: [AEOUT], parameters: {codelist_id: AEOUT}}
  AE_DATES:
    - {transform_id: to_iso8601_date, source_keys: [ae_raw.IT.AESTDAT], target_variables: [AESTDTC], parameters: {formats: [m/d/y, dd-mmm-yyyy, y-m-d]}}
    - {transform_id: to_iso8601_date, source_keys: [ae_raw.IT.AEENDAT], target_variables: [AEENDTC], parameters: {formats: [m/d/y, dd-mmm-yyyy, y-m-d]}}
    - {transform_id: derive_ongoing_flag, source_keys: [ae_raw.IT.AEENDAT], target_variables: [AEENRF], parameters: {ongoing_value: ONGOING, affirmative_values: ['Y', 'Yes']}}
    - {transform_id: derive_study_day, source_keys: [], target_variables: [AESTDY], parameters: {target_date: AESTDTC, reference_date: RFSTDTC}}
    - {transform_id: derive_study_day, source_keys: [], target_variables: [AEENDY], parameters: {target_date: AEENDTC, reference_date: RFSTDTC}}
  AE_SEQUENCE:
    - {transform_id: derive_sequence, source_keys: [], target_variables: [AESEQ], parameters: {record_variables: [STUDYID, USUBJID, AESTDTC, AETERM, AEDECOD, .SOURCE_ROW], start_at: 1}}
  VS_CORE:
    - {transform_id: assign_no_ct, source_keys: [vs_raw.STUDY], target_variables: [STUDYID], parameters: {}}
    - {transform_id: hardcode_no_ct, source_keys: [], target_variables: [DOMAIN], parameters: {value: VS}}
    - {transform_id: derive_usubjid, source_keys: [vs_raw.STUDY, vs_raw.PATNUM], target_variables: [USUBJID], parameters: {separator: '-'}}
    - {transform_id: assign_no_ct, source_keys: [vs_raw.INSTANCE], target_variables: [VISIT], parameters: {}}
    - {transform_id: to_iso8601_date, source_keys: [vs_raw.VTLD], target_variables: [VSDTC], parameters: {formats: [dd-mmm-yyyy, m/d/y, y-m-d]}}
    - {transform_id: assign_ct, source_keys: [vs_raw.SUBPOS], target_variables: [VSPOS], parameters: {codelist_id: VSPOS}}
    - {transform_id: derive_visitnum, source_keys: [vs_raw.INSTANCE], target_variables: [VISITNUM], parameters: {visit_map_id: trace_visits_v1}}
  VS_HEIGHT:
    - {transform_id: transpose_findings, source_keys: [vs_raw.IT.HEIGHT_VSORRES], target_variables: [VSTESTCD, VSTEST, VSORRES, VSORRESU], parameters: {test_code: HEIGHT, test_name: Height, original_unit: cm, unit_source: null}}
    - {transform_id: standardize_unit, source_keys: [vs_raw.IT.HEIGHT_VSORRES], target_variables: [VSSTRESC, VSSTRESN, VSSTRESU], parameters: {conversion_set_id: vs_standard_v1, target_unit: cm}}
  VS_WEIGHT:
    - {transform_id: transpose_findings, source_keys: [vs_raw.IT.WEIGHT], target_variables: [VSTESTCD, VSTEST, VSORRES, VSORRESU], parameters: {test_code: WEIGHT, test_name: Weight, original_unit: kg, unit_source: null}}
    - {transform_id: standardize_unit, source_keys: [vs_raw.IT.WEIGHT], target_variables: [VSSTRESC, VSSTRESN, VSSTRESU], parameters: {conversion_set_id: vs_standard_v1, target_unit: kg}}
  VS_TEMP:
    - {transform_id: transpose_findings, source_keys: [vs_raw.IT.TEMP], target_variables: [VSTESTCD, VSTEST, VSORRES, VSORRESU], parameters: {test_code: TEMP, test_name: Temperature, original_unit: C, unit_source: null}}
    - {transform_id: standardize_unit, source_keys: [vs_raw.IT.TEMP], target_variables: [VSSTRESC, VSSTRESN, VSSTRESU], parameters: {conversion_set_id: vs_standard_v1, target_unit: C}}
  VS_SYSBP:
    - {transform_id: transpose_findings, source_keys: [vs_raw.SYS_BP], target_variables: [VSTESTCD, VSTEST, VSORRES, VSORRESU], parameters: {test_code: SYSBP, test_name: Systolic Blood Pressure, original_unit: mmHg, unit_source: null}}
    - {transform_id: standardize_unit, source_keys: [vs_raw.SYS_BP], target_variables: [VSSTRESC, VSSTRESN, VSSTRESU], parameters: {conversion_set_id: vs_standard_v1, target_unit: mmHg}}
  VS_DIABP:
    - {transform_id: transpose_findings, source_keys: [vs_raw.DIA_BP], target_variables: [VSTESTCD, VSTEST, VSORRES, VSORRESU], parameters: {test_code: DIABP, test_name: Diastolic Blood Pressure, original_unit: mmHg, unit_source: null}}
    - {transform_id: standardize_unit, source_keys: [vs_raw.DIA_BP], target_variables: [VSSTRESC, VSSTRESN, VSSTRESU], parameters: {conversion_set_id: vs_standard_v1, target_unit: mmHg}}
  VS_PULSE:
    - {transform_id: transpose_findings, source_keys: [vs_raw.PULSE], target_variables: [VSTESTCD, VSTEST, VSORRES, VSORRESU], parameters: {test_code: PULSE, test_name: Pulse Rate, original_unit: beats/min, unit_source: null}}
    - {transform_id: standardize_unit, source_keys: [vs_raw.PULSE], target_variables: [VSSTRESC, VSSTRESN, VSSTRESU], parameters: {conversion_set_id: vs_standard_v1, target_unit: beats/min}}
  VS_POST_DERIVATIONS:
    - {transform_id: derive_sequence, source_keys: [], target_variables: [VSSEQ], parameters: {record_variables: [STUDYID, USUBJID, VSDTC, VSTESTCD, VSPOS, VISITNUM, .SOURCE_ROW], start_at: 1}}
    - {transform_id: derive_study_day, source_keys: [], target_variables: [VSDY], parameters: {target_date: VSDTC, reference_date: RFSTDTC}}
