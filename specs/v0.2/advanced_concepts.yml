schema_version: '0.2'
specification:
  name: TraceSDTM advanced concept specification
  version: 0.2.0
  status: draft
  standard: SDTMIG 3.4
  scenario: advanced
  approval: {reviewer: null, approved_at: null, review_workbook_sha256: null}
source_catalog:
  dm_subject: {file: dm_subject.csv, form_name: Demographics, grain: one_record_per_subject, keys: [STUDY, PATNUM]}
  ex_a_raw: {file: ex_a_raw.csv, form_name: Exposure A, grain: many_records_per_subject, keys: [STUDY, PATNUM]}
  ex_b_raw: {file: ex_b_raw.csv, form_name: Exposure B, grain: many_records_per_subject, keys: [STUDY, PATNUM]}
  ae_main: {file: ae_main.csv, form_name: Adverse Events, grain: one_record_per_event, keys: [STUDY, PATNUM, AEID]}
  sae_detail: {file: sae_detail.csv, form_name: Serious Adverse Event Details, grain: one_record_per_event, keys: [STUDY, PATNUM, AEID]}
  ae_merged: {derived: true, form_name: Adverse Events + Serious Adverse Event Details, grain: one_record_per_event, keys: [STUDY, PATNUM, AEID]}
  vs_mixed: {file: vs_mixed.csv, form_name: Vital Signs, grain: one_record_per_subject_visit, keys: [STUDY, PATNUM, INSTANCE]}
domain_sources:
  DM: dm_subject
  AE: ae_main
  VS: vs_mixed
concepts:
  - concept_id: DM_CORE
    target_domain: DM
    form_name: Demographics
    source_refs:
      - {dataset: dm_subject, variable: STUDY, role: study_identifier}
      - {dataset: dm_subject, variable: PATNUM, role: subject_identifier}
    depends_on: []
    expected_cardinality: one_record_to_one_record
    required: true
  - concept_id: DM_REFERENCE_START
    target_domain: DM
    form_name: Exposure A + Exposure B
    source_refs:
      - {dataset: ex_a_raw, variable: EXSTDAT, role: date}
      - {dataset: ex_a_raw, variable: EXSTTIM, role: time}
      - {dataset: ex_b_raw, variable: DOSE_DATE, role: date}
      - {dataset: ex_b_raw, variable: DOSE_TIME, role: time}
    depends_on: [DM_CORE]
    expected_cardinality: many_records_to_one_subject
    required: true
  - concept_id: DM_CONSENT
    target_domain: DM
    form_name: Demographics
    source_refs: [{dataset: dm_subject, variable: IC_DT, role: date}]
    depends_on: [DM_CORE]
    expected_cardinality: one_record_to_one_record
    required: true
  - concept_id: DM_DEMOGRAPHICS
    target_domain: DM
    form_name: Demographics
    source_refs:
      - {dataset: dm_subject, variable: AGE, role: age}
      - {dataset: dm_subject, variable: SEX, role: sex}
      - {dataset: dm_subject, variable: ETHNIC, role: ethnicity}
      - {dataset: dm_subject, variable: RACE, role: race}
      - {dataset: dm_subject, variable: COUNTRY, role: country}
    depends_on: [DM_CORE]
    expected_cardinality: one_record_to_one_record
    required: true
  - concept_id: DM_TREATMENT
    target_domain: DM
    form_name: Demographics
    source_refs:
      - {dataset: dm_subject, variable: PLANNED_ARMCD, role: planned_arm_code}
      - {dataset: dm_subject, variable: PLANNED_ARM, role: planned_arm}
      - {dataset: dm_subject, variable: ACTUAL_ARMCD, role: actual_arm_code}
      - {dataset: dm_subject, variable: ACTUAL_ARM, role: actual_arm}
    depends_on: [DM_CORE]
    expected_cardinality: one_record_to_one_record
    required: true
  - concept_id: AE_SOURCE_INTEGRATION
    target_domain: AE
    form_name: Adverse Events + Serious Adverse Event Details
    source_refs:
      - {dataset: ae_main, variable: STUDY, role: join_key}
      - {dataset: ae_main, variable: PATNUM, role: join_key}
      - {dataset: ae_main, variable: AEID, role: join_key}
      - {dataset: sae_detail, variable: STUDY, role: join_key}
      - {dataset: sae_detail, variable: PATNUM, role: join_key}
      - {dataset: sae_detail, variable: AEID, role: join_key}
      - {dataset: sae_detail, variable: AESHOSP, role: hospitalization_indicator}
    depends_on: []
    expected_cardinality: one_record_to_one_record
    required: true
  - concept_id: AE_CORE
    target_domain: AE
    form_name: Adverse Events
    source_refs:
      - {dataset: ae_merged, variable: STUDY, role: study_identifier}
      - {dataset: ae_merged, variable: PATNUM, role: subject_identifier}
    depends_on: [AE_SOURCE_INTEGRATION, DM_CORE]
    expected_cardinality: one_record_to_one_record
    required: true
  - concept_id: AE_TERMS
    target_domain: AE
    form_name: Adverse Events
    source_refs:
      - {dataset: ae_merged, variable: AETERM, role: reported_term}
      - {dataset: ae_merged, variable: AEDECOD, role: coded_term}
      - {dataset: ae_merged, variable: AEBODSYS, role: body_system}
    depends_on: [AE_SOURCE_INTEGRATION]
    expected_cardinality: one_record_to_one_record
    required: true
  - concept_id: AE_SAFETY
    target_domain: AE
    form_name: Adverse Events + Serious Adverse Event Details
    source_refs:
      - {dataset: ae_merged, variable: AESEV, role: severity}
      - {dataset: ae_merged, variable: AESER, role: serious_indicator}
      - {dataset: ae_merged, variable: AESHOSP, role: hospitalization_indicator}
    depends_on: [AE_SOURCE_INTEGRATION]
    expected_cardinality: one_record_to_one_record
    required: true
  - concept_id: AE_REL_OUTCOME
    target_domain: AE
    form_name: Adverse Events
    source_refs:
      - {dataset: ae_merged, variable: AEREL, role: causality}
      - {dataset: ae_merged, variable: AEOUTCOME, role: outcome}
    depends_on: [AE_SOURCE_INTEGRATION]
    expected_cardinality: one_record_to_one_record
    required: true
  - concept_id: AE_START
    target_domain: AE
    form_name: Adverse Events
    source_refs:
      - {dataset: ae_merged, variable: AESTDAT, role: date}
      - {dataset: ae_merged, variable: AESTTIM, role: time}
    depends_on: [AE_SOURCE_INTEGRATION, DM_REFERENCE_START]
    expected_cardinality: one_record_to_one_record
    required: true
  - concept_id: AE_END
    target_domain: AE
    form_name: Adverse Events
    source_refs:
      - {dataset: ae_merged, variable: AEENDDAT, role: date}
      - {dataset: ae_merged, variable: AEENDTIM, role: time}
      - {dataset: ae_merged, variable: AEONGO, role: ongoing_indicator}
    depends_on: [AE_SOURCE_INTEGRATION, DM_REFERENCE_START]
    expected_cardinality: one_record_to_one_record
    required: true
  - concept_id: AE_SEQUENCE
    target_domain: AE
    form_name: Adverse Events
    source_refs: []
    depends_on: [AE_CORE, AE_TERMS, AE_START]
    expected_cardinality: domain_post_derivation
    required: true
  - concept_id: VS_CORE
    target_domain: VS
    form_name: Vital Signs
    source_refs:
      - {dataset: vs_mixed, variable: STUDY, role: study_identifier}
      - {dataset: vs_mixed, variable: PATNUM, role: subject_identifier}
      - {dataset: vs_mixed, variable: INSTANCE, role: visit}
      - {dataset: vs_mixed, variable: VTLD, role: date}
      - {dataset: vs_mixed, variable: VSTIM, role: time}
      - {dataset: vs_mixed, variable: SUBPOS, role: body_position}
    depends_on: [DM_REFERENCE_START]
    expected_cardinality: one_record_to_many_findings
    required: true
  - concept_id: VS_HEIGHT
    target_domain: VS
    form_name: Vital Signs
    source_refs:
      - {dataset: vs_mixed, variable: HEIGHT, role: result}
      - {dataset: vs_mixed, variable: HEIGHTU, role: original_unit}
    depends_on: [VS_CORE]
    expected_cardinality: one_observed_value_to_one_record
    required: true
  - concept_id: VS_WEIGHT
    target_domain: VS
    form_name: Vital Signs
    source_refs:
      - {dataset: vs_mixed, variable: WEIGHT, role: result}
      - {dataset: vs_mixed, variable: WEIGHTU, role: original_unit}
    depends_on: [VS_CORE]
    expected_cardinality: one_observed_value_to_one_record
    required: true
  - concept_id: VS_TEMP
    target_domain: VS
    form_name: Vital Signs
    source_refs:
      - {dataset: vs_mixed, variable: TEMP, role: result}
      - {dataset: vs_mixed, variable: TEMPU, role: original_unit}
    depends_on: [VS_CORE]
    expected_cardinality: one_observed_value_to_one_record
    required: true
  - concept_id: VS_SYSBP
    target_domain: VS
    form_name: Vital Signs
    source_refs:
      - {dataset: vs_mixed, variable: SYS_BP, role: result}
      - {dataset: vs_mixed, variable: SYS_BPU, role: original_unit}
    depends_on: [VS_CORE]
    expected_cardinality: one_observed_value_to_one_record
    required: true
  - concept_id: VS_DIABP
    target_domain: VS
    form_name: Vital Signs
    source_refs:
      - {dataset: vs_mixed, variable: DIA_BP, role: result}
      - {dataset: vs_mixed, variable: DIA_BPU, role: original_unit}
    depends_on: [VS_CORE]
    expected_cardinality: one_observed_value_to_one_record
    required: true
  - concept_id: VS_PULSE
    target_domain: VS
    form_name: Vital Signs
    source_refs:
      - {dataset: vs_mixed, variable: PULSE, role: result}
      - {dataset: vs_mixed, variable: PULSEU, role: original_unit}
    depends_on: [VS_CORE]
    expected_cardinality: one_observed_value_to_one_record
    required: true
  - concept_id: VS_POST_DERIVATIONS
    target_domain: VS
    form_name: Vital Signs
    source_refs: []
    depends_on: [VS_HEIGHT, VS_WEIGHT, VS_TEMP, VS_SYSBP, VS_DIABP, VS_PULSE]
    expected_cardinality: domain_post_derivation
    required: true
